    :`<div class="row"><button class="pillbtn ${r.sizeOk&&!r.unsure?'on':''}" data-a="sizeok" data-v="${i}">Looks right</button><button class="pillbtn" data-a="sizeadj" data-v="${i}">Adjust it</button>${side?`<button class="pillbtn ${r.unsure?'on':''}" data-a="sizens" data-v="${i}">Not sure</button>`:''}</div>
      <p style="font-size:14.5px;color:var(--muted);margin-top:8px">${side?'Pace the length. A big step is about a metre. A single storey is usually 2.4 to 2.7 m high.':'Near enough is fine. We measure on the day.'}</p>`}</div></div></div></div>`}
function unitBody(r,i,us){
  const side=r.t==='side',next=us.find((x,j)=>j>i&&!x.ok)||us.find(x=>!x.ok&&x!==r);let n=1,h='<div class="rc-b">';
  if(side){h+=`<div class="blk"><h3><i class="done">${tick(12)}</i>Are we painting this side?</h3><div class="body"><div class="row" style="display:flex;gap:10px"><button class="pillbtn ${r.paint==='yes'?'on':''}" data-a="paint" data-v="yes" data-r="${i}">Yes</button><button class="pillbtn" data-a="paint" data-v="no" data-r="${i}">No, leave it off</button></div></div></div>`;n=2}
  h+=sizeBlock(r,i,n++);
  if(side&&r.walls){const ks=Object.keys(r.walls),sum=ks.reduce((a,k)=>a+r.walls[k],0);
    h+=`<div class="blk mixbox"><h3><i>${n++}</i>The walls on this side</h3><div class="body"><div class="tiles">${ks.map(m=>`<div class="tile on w2"><span class="t" style="cursor:default">${PIC.walls}<span class="lb">${m}</span></span><div class="ctl"><span class="mini">${[25,50,75,100].map(p=>`<button class="${r.walls[m]===p?'on':''}" data-a="share" data-v="${p}" data-r="${i}" data-k="${m}">${p}%</button>`).join('')}</span></div></div>`).join('')}</div>
      <p class="mix ${sum===100?'ok':''}">${sum===100?'Adds up to 100%.':`Adds up to ${sum}%. Tap a share on each surface.`}</p></div></div>`}
  h+=`<div class="blk"><h3><i>${n++}</i>${side?'Also on this side':'What we’re painting in here'}</h3><div class="body"><div class="tiles">${r.tiles.map(t=>tileHTML(r,i,t)).join('')}
      <button class="tile" data-a="noop" style="border-style:dashed;align-items:center;justify-content:center;font-weight:600;color:var(--teal)">+ Add a surface</button></div></div></div>`;
  if(r.robe)h+=`<div class="blk"><h3><i>${n++}</i>Built-in robe</h3><div class="body"><div class="yn"><span>Paint the robe doors?</span><span class="mini">${[['yes','Yes'],['no','No']].map(([v,l])=>`<button class="${r.robe===v?'on':''}" data-a="robe" data-v="${v}" data-r="${i}">${l}</button>`).join('')}</span></div><div class="yn"><span>Paint the walls inside the robe?</span><span class="mini"><button>Yes</button><button class="on">No</button></span></div></div></div>`;
  h+=`<div class="confirm"><button class="btn pri" data-a="confirm" data-v="${i}">${tick(18)} Confirm ${r.name.toLowerCase()==='front'||side?'the '+r.name.toLowerCase():r.name}</button><span class="flag" id="gap${i}"></span><span style="font-size:14.5px;color:var(--muted)">${next?'Then on to '+(side?'the '+next.name.toLowerCase():next.name):'Then the last checks'}</span></div></div>`;
  return h}
/* One section of the checking screen (inside or outside). On a "both" job the two are STACKED on one page
   (Tom's ruling, Batch 4): inside first, then the sides, one combined count, one pair of buttons. */
function sectionHTML(active){
  const t=S.tab,out=t==='out',us=U(),done=us.filter(r=>r.ok).length;
  const QL=out?QOUT:QIN(),qi=out?S.qj:S.qi,qd=(out?S.qb:S.qa).filter(a=>a!=null).length,chk=out?S.checksOut:S.checks;
  let h=`<p class="sect"><span>${out?'A few questions first':isCom()?'About the whole space':'About the whole home'}</span><span>${Math.min(qi,QL.length)} of ${QL.length}</span></p>`;
  if(!active)h+=`<button class="rc" data-a="tab" data-v="${t}" style="text-align:left;width:100%"><span class="rc-h" style="display:grid"><span class="st">${qd===QL.length?TICK:'?'}</span><span><b>${qd} of ${QL.length} answered</b><small>${out?'Paintwork, timber rot and access':'A few quick details about what’s there'}</small></span><span class="act">${qd===QL.length?'Done':'Answer these'} ${CHEV}</span></span></button>`;
  else if(qi<QL.length){const q=QL[qi],p=out?'ext':partKeys().find(x=>x!=='ext'),share=.5*(RNG[p][0][1]-RNG[p][0][0]-(RNG[p][1][1]-RNG[p][1][0]))/QL.length;
    h+=`<div class="qq"><div class="art">${PIC[q[3]].replace('class="pic"','style="color:var(--teal)"')}</div><div><div class="meta"><span class="dots">${QL.map((_,i)=>`<i class="${i<qi?'d':i===qi?'c':''}"></i>`).join('')}</span><b>Closes about ${money(share)} of your range</b></div>
      <h3>${q[0]}</h3>${q[1]?`<p>${q[1]}</p>`:''}<div class="row">${q[2].map(([v,l])=>`<button class="pillbtn" data-a="qans" data-v="${v}">${l}</button>`).join('')}<button class="skip" data-a="qskip">Skip for now</button></div></div></div>`;
  }else h+=`<div class="qq done"><div style="display:flex;gap:12px;align-items:center;font-weight:600"><span class="av" style="width:34px;height:34px;background:var(--teal);color:#fff">${tick(15)}</span>${qd} of ${QL.length} answered. ${qd<QL.length?'You can come back to the rest.':'Thank you.'}</div></div>`;
  h+=`<p class="sect"><span>${out?'Side by side':isCom()?'Area by area':'Room by room'}</span><span>${done} of ${us.length} checked</span></p>`;
  us.forEach((r,i)=>{const open=active&&S.open===i,skip=r.paint==='no';
    h+=`<div class="rc ${open?'open':''} ${r.ok&&!skip?'ok':''} ${skip?'skip':''}" id="${active?'rc':'rx'+t}${i}"><button class="rc-h" data-a="${active?'open':'xopen'}" data-t="${t}" data-v="${i}" aria-expanded="${open}"><span class="st">${r.ok&&!skip?TICK:i+1}</span><span><b>${r.name}</b><small><span class="mono" style="font-size:13px">${dimTxt(r)}</span>${r.ok?' · '+unitSummary(r):''}</small></span><span class="act">${skip?'Not painting':r.ok?'Checked':open?'Close':'Check this '+unitWord()} ${CHEV}</span></button>${open?unitBody(r,i,us):''}</div>`});
  const doors=us.reduce((a,r)=>a+(r.paint!=='no'&&r.s.doors&&r.s.doors.on?r.s.doors.n:0),0),wins=us.reduce((a,r)=>a+(r.paint!=='no'&&r.s.windows&&r.s.windows.on?r.s.windows.n:0),0);
  h+=`<p class="sect"><span>Last checks</span><span>${chk?'Done':''}</span></p>
  <div class="qq ${chk?'done':''}" style="grid-template-columns:1fr"><div><h3 style="margin:0">We make it ${doors} door${doors===1?'':'s'}${S.rooms&&S.rooms[0]&&S.rooms[0].t==='wh'&&!out?'':` and ${wins} window${wins===1?'':'s'}`} ${out?'around the house':isCom()?'across the space':'across the home'}. Is that right?</h3>${out?`<p style="margin-top:6px">And any sides or bits we’ve missed? Sheds, side gates and the fence behind the house are the usual ones.</p>`:''}${chk?'':`<div class="row"><button class="pillbtn" data-a="${active?'checks':'tab'}" data-v="${t}">${active?'Nothing missed':'Check these'}</button>${active?`<button class="pillbtn" data-a="noop">Something’s off, I’ll adjust</button>`:''}</div>`}</div></div>`;
  if(out){const sep=EXT_SEP.filter(([k])=>S.ext.sep[k]);
    h+=`<div class="card" style="border-radius:20px"><h3>Freestanding extras <span>${sep.length?sep.length+' ticked':'Optional'}</span></h3><p style="color:var(--muted);font-size:15.5px;margin-top:4px">Not on a wall: fences, pergolas and the like. Tick any that apply.</p>
    <div class="extras">${EXT_SEP.map(([k,l])=>`<button class="chip ${S.ext.sep[k]?'on':''}" data-a="xsep" data-v="${k}"><span class="bx">${TICK}</span>${l}</button>`).join('')}<button class="chip plain" data-a="noop">+ Something else</button></div></div>`}
  else if(!isCom())h+=`<div class="card" style="border-radius:20px"><h3>Anything we haven’t listed? <span>Optional</span></h3><p style="color:var(--muted);font-size:15.5px;margin-top:4px">Tap to add. Anything unusual, tell us in your own words and a person will price it properly.</p>
    <div class="extras">${[['Air vent',180],['Mantle',95],['Picture rails',95],['Window reveals',95]].map(([n,p])=>`<button class="chip ${S.extras[n]?'on':''}" data-a="extra" data-v="${n}"><span class="bx">${TICK}</span>${n} <span class="mono">${money(p)}</span></button>`).join('')}<button class="chip plain" data-a="noop">+ Something else</button></div></div>`;
  else h+=`<div class="card" style="border-radius:20px"><h3>Anything we haven’t listed? <span>Optional</span></h3><p style="color:var(--muted);font-size:15.5px;margin-top:4px">Tell us in your own words and your estimator will price it properly on the visit.</p><div class="extras"><button class="chip plain" data-a="noop">+ Add something</button></div></div>`;
  return h}
function renderEd(){
  const act=S.tab,both=hasIn()&&hasOut(),[lo,hi]=range(),tr=tier();
  const all=(S.rooms||[]).concat(S.sides||[]),doneAll=all.filter(r=>r.ok).length;
  let h=`<div class="ed-title"><h1>${act==='out'&&!both?'Walk around the house, one side at a time':'Now let’s get it exact'}</h1><p>${act==='out'&&!both?'Front, both sides, back. Check each one and it turns blue.':`Check each ${isCom()?'area':'room'}${both?', then each side,':''} and answer a few quick questions.`} Your range narrows as you go, and nothing is fixed until Tom has confirmed it with you.</p></div>`;
  if(both)h+=`<div class="tabs" role="navigation" aria-label="Jump to"><button class="${act==='in'?'on':''}" data-a="tab" data-v="in">Inside <span>${S.rooms.filter(r=>r.ok).length}/${S.rooms.length} rooms</span></button><button class="${act==='out'?'on':''}" data-a="tab" data-v="out">Outside <span>${S.sides.filter(r=>r.ok).length}/${S.sides.length} sides</span></button></div>`;
  (both?['in','out']:[act]).forEach(t=>{S.tab=t;if(both)h+=`<h2 class="sechead" id="sec-${t}">${t==='in'?'Inside, room by room':'Now the outside, one side at a time'}</h2>`;h+=sectionHTML(t===act)});
  S.tab=act;
  $('#edmain').innerHTML=h;

  /* price rail */
  const [g0,g1]=range0(),mn=g0-(g1-g0)*.12,mx=g1+(g1-g0)*.12,scale=v=>(v-mn)/(mx-mn)*100;
  const pe=$('#price');
  if(!pe.dataset.built){pe.dataset.built=1;pe.innerHTML=`<div class="lab"><span>Your range</span><span class="pill" id="pTier"></span></div><p class="num" id="pNum"></p><p class="gst">Includes GST</p><div id="pParts"></div>
    <div class="band"><span class="was" style="left:${scale(g0)}%;width:${scale(g1)-scale(g0)}%"></span><span class="now" id="pBand"></span></div><div class="bandlab"><span>Dashed line: where your guide range started</span></div>
    <ul class="todo" id="pTodo"></ul><button class="btn pri" data-a="finish">Finalise my price ${ARROW}</button><button class="btn sec" data-a="finish">Book a time with Tom</button>`}
  $('#pTier').className='pill '+(tr==='det'?'det':'');$('#pTier').textContent=(tr==='det'?'Detailed':'Guide')+' · within '+pct()+'%';
  $('#pNum').textContent=money(lo)+' – '+money(hi);
  $('#pParts').innerHTML=both?`<div class="parts" style="margin-top:12px"><div class="part"><span>Inside</span><b>${rangeOf('int').map(money).join(' – ')}</b></div><div class="part"><span>Outside</span><b>${rangeOf('ext').map(money).join(' – ')}</b></div></div>`:'';
  $('#pBand').style.left=scale(lo)+'%';$('#pBand').style.width=(scale(hi)-scale(lo))+'%';
  const rows=[];
  if(hasIn())rows.push([isCom()?'Quick questions':'Questions about the home',`${S.qa.filter(a=>a!=null).length}/${QIN().length}`,S.qa.filter(a=>a!=null).length===QIN().length],[isCom()?'Areas checked':'Rooms checked',`${S.rooms.filter(r=>r.ok).length}/${S.rooms.length}`,S.rooms.every(r=>r.ok)]);
  if(hasOut())rows.push(['Questions about the outside',`${S.qb.filter(a=>a!=null).length}/${QOUT.length}`,S.qb.filter(a=>a!=null).length===QOUT.length],['Sides checked',`${S.sides.filter(r=>r.ok).length}/${S.sides.length}`,S.sides.every(r=>r.ok)]);
  const cn=(hasIn()?1:0)+(hasOut()?1:0),cd=(hasIn()&&S.checks?1:0)+(hasOut()&&S.checksOut?1:0);rows.push(['Last checks',`${cd}/${cn}`,cd===cn]);
  $('#pTodo').innerHTML=rows.map(([l,c,d])=>`<li class="${d?'d':''}"><i>${TICK}</i>${l}<span>${c}</span></li>`).join('');
  const word=both?'rooms and sides':hasOut()?'sides':isCom()?'areas':'rooms';
  $('#mstrip').innerHTML=`<span><span class="mono">${money(lo)} – ${money(hi)}</span><small>${tr==='det'?'Detailed':'Guide'} · within ${pct()}% · ${doneAll} of ${all.length} ${word}</small></span><div class="band"><span class="was" style="left:${scale(g0)}%;width:${scale(g1)-scale(g0)}%"></span><span class="now" style="left:${scale(lo)}%;width:${scale(hi)-scale(lo)}%"></span></div>`;
  $('#mapT').textContent=both?'Your home, inside and out':hasOut()?'Your home from above':isCom()?'Your space':'Your home';
  $('#mapN').textContent=`${doneAll} of ${all.length} checked`;
  $('#artPlan').style.display=hasIn()?'':'none';$('#artTop').style.display=hasOut()?'':'none';
  if(hasOut()){const by=Object.fromEntries(S.sides.map((s,i)=>[s.key,[s,i]]));
    drawTop($('#top2'),SIDES.map(([k,l])=>{const e=by[k];return e?{key:k,label:l.replace(' side',''),cls:(e[0].paint==='no'?'skip':e[0].ok?'ok':'todo')+(act==='out'&&S.open===e[1]?' cur':''),a:'xopen',t:'out',v:e[1]}:{key:k,label:l.replace(' side',''),cls:'skip'}}))}
  if(hasIn())drawPlan($('#plan2'),S.rooms.map((r,i)=>({name:r.name,w:r.t==='wh'?400:r.l*r.w,t:r.t,i,cls:(r.ok?'ok':'todo')+(act==='in'&&S.open===i?' cur':'')})));
}
function tightened(before){const [a,b]=range(),d=(before[1]-before[0])-(b-a);if(d>0)toast(`Range narrowed by <b>${money(d)}</b>`)}

A.extra=function(v){if(S.phase==='editor'&&S.tab==='out'&&EXT_SEP.some(e=>e[0]===v))tog(S.ext.sep,v);else S.extras[v]=!S.extras[v];renderEd()};

/* ───────── finalise ───────── */
const NEXT4=(com)=>`<ol class="steps4">
      <li class="d"><i>${tick(14)}</i><span><b>See your price</b><small>Done. Your range is saved to your account.</small></span></li>
      <li class="c"><i>2</i><span><b>We confirm it with you</b><small>${com?'On site. You get a scope of works and a fixed quote, with our insurance certificates and safe work method statements attached.':hasOut()?'On site. Then the price is fixed.':'In person or over the phone. Then the price is fixed.'}</small></span></li>
      <li><i>3</i><span><b>Pick your dates</b><small>You’ll know who’s coming before the date is locked in.</small></span></li>
      <li><i>4</i><span><b>Sign off, then pay</b><small>A walkthrough with you at the end. The final invoice waits for it.</small></span></li></ol>`;
function renderFinish(){
  const [lo,hi]=range(),tr=tier(),com=isCom(),both=hasIn()&&hasOut(),us=(S.rooms||[]).concat(S.sides||[]),visit=hasOut()||com;
  $('#screen').innerHTML=`<div class="fin ${S.enter?'enter':''}">
  <div style="display:grid;gap:16px">
    <div class="rangecard"><p class="rlabel">Your ${tr==='det'?'detailed':'guide'} range <span class="pill ${tr==='det'?'det':''}">${tr==='det'?'Detailed':'Guide'} · within ${pct()}%</span></p>
      <p class="bigrange" style="font-size:clamp(26px,3.6vw,46px)">${money(lo)}<span>–</span>${money(hi)}</p><p class="gst">Includes GST. ${S.addr}</p>
      ${both?`<div class="parts"><div class="part"><span>Inside</span><b>${rangeOf('int').map(money).join(' – ')}</b></div><div class="part"><span>Outside</span><b>${rangeOf('ext').map(money).join(' – ')}</b></div></div>`:''}
      <p class="based">One step left: Tom confirms it with you${visit?' on site':''}, and then it’s a fixed price. No surprises on the invoice.</p></div>
    <div class="card"><h3>What you’ve told us <span>${us.filter(r=>r.ok).length} of ${us.length} checked</span></h3><ul class="assumed stack">${us.map(r=>`<li><span>${r.name} <span class="mono" style="font-size:12.5px">${dimTxt(r)}</span></span><b style="font-weight:500;text-align:right">${unitSummary(r)}</b></li>`).join('')}</ul></div>
  </div>
  <div style="display:grid;gap:16px">
    <div class="card"><h3>${com?'Book your commercial estimator':'Make it a fixed price'}</h3>
      <div class="who" style="margin-top:14px"><span class="av">TR</span><span><b>${estName}, your estimator</b><small>A one-hour visit. Tom checks the details and confirms your price${com?' with a written scope of works':' on the spot'}.</small></span></div>
      <p style="font-weight:600;margin-top:16px;font-size:16px">Times Tom is in your area</p>
      ${slotsHTML()}
      <button class="btn pri" style="width:100%;margin-top:16px" data-a="noop">${S.slot!=null?'Book this visit':'Choose a time'} ${ARROW}</button>
      <button class="btn sec" style="width:100%;margin-top:8px;min-height:52px;font-size:16.5px" data-a="noop">${visit?'None of these suit? Request a time':'Request a call instead'}</button>
      ${visit?`<p class="note">${com?'Commercial jobs':'Outside jobs'} are always confirmed on site, so there’s no phone sign-off for this one.</p>`:''}</div>
    <div class="card"><h3>What happens next</h3>${NEXT4(com)}</div>
  </div></div>`;
}
function renderBooked(){
  const b=BRIEF[briefKey()]||BRIEF.strata,sl=S.slot!=null?SLOTS[S.slot]:null,first=S.name?S.name.split(' ')[0]:'';
  $('#screen').innerHTML=`<div class="booked enter"><div class="pane" style="max-width:none">
    <div class="bigtick">${TICK}</div>
    <p class="kick">Booked</p><h1>${sl?'You’re booked in':'Your brief is with us'}</h1>
    <p class="sub">${sl?`${first?first+', your':'Your'} estimator will be at ${S.addr||'the property'} on ${sl[0]} at ${sl[1]}, with your brief and photos in hand.`:'We’ll call to arrange a time that suits. Your answers are saved, so nobody asks you twice.'}</p>
    <div class="card" style="margin-top:28px"><h3>What happens next</h3><ol class="steps4">
      <li class="d"><i>${tick(14)}</i><span><b>${b.title.replace('Tell us','You told us')}</b><small>Done. A confirmation is on its way to ${S.email||'your email'}.</small></span></li>
      <li class="c"><i>2</i><span><b>We visit and measure</b><small>Usually within a week. We bring your brief and photos, so it’s quick.</small></span></li>
      <li><i>3</i><span><b>You get a scope of works and a fixed quote</b><small>Itemised, with our insurance certificates and safe work method statements attached.</small></span></li>
      <li><i>4</i><span><b>Nothing is fixed until you say so</b><small>Quotes are held for 60 days, or to your meeting date if you gave us one.</small></span></li></ol></div>
    <p class="note" style="margin-top:18px">Nothing is fixed until you say so, and nothing is owed. Something urgent? <a href="tel:0388409414">Call 03 8840 9414</a></p>
    <div class="talk" style="margin-top:22px">${talkHTML().replace('Rather talk it through?','Need to change something?')}</div>
  </div></div>`;
}
render();
</script>
</body>
