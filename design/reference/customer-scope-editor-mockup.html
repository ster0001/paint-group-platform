<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape your estimate · Paint Group</title>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0B0D;--panel:#12161A;--panel2:#171C21;--line:#242B32;--text:#EDF0F2;--muted:#8C959D;
--cyan:#3BD8E9;--oncyan:#03272D;--amber:#E0A83C;--emerald:#2FA46B;--clay:#B3574A;
--sans:"Switzer",-apple-system,sans-serif;--mono:"Martian Mono",ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:150px}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:rgba(10,11,13,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.wm{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.22em}.wm span{color:var(--cyan)}
.demo{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:3px;gap:3px}
.demo button{border:none;background:none;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:8px 14px;border-radius:100px;cursor:pointer}
.demo button.on{background:var(--cyan);color:var(--oncyan)}
.wrap{max-width:1020px;margin:0 auto;padding:20px}
.scorebar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:14px}
.score{display:flex;align-items:center;gap:12px}
.sc-ring{position:relative;width:48px;height:48px}
.sc-ring svg{transform:rotate(-90deg)}
.sc-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700}
.score .lbl b{display:block;font-size:14px;font-weight:600}
.score .lbl span{font-size:12px;color:var(--muted)}
.range{text-align:right}
.range .r{font-family:var(--mono);font-size:clamp(16px,3vw,21px);font-weight:700;transition:opacity .15s}
.range small{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--muted)}
.range.flash .r{animation:pf .6s}
@keyframes pf{0%{color:var(--cyan)}100%{color:var(--text)}}
.grid{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.visual{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
@media(min-width:861px){.visual{position:sticky;top:74px}}
.visual .t{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
svg.plan{width:100%;height:auto;display:block}
.rm{fill:#171C21;stroke:#39424B;stroke-width:1.2}
.plan text{font-family:var(--mono);font-size:7.5px;fill:#8C959D}
/* facade */
.facade{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:linear-gradient(#101820 0 30%,#0C1116 30%)}
.f-roof{position:absolute;left:4%;right:4%;top:14%;height:16%;background:linear-gradient(150deg,#2A333B,#1B2229);clip-path:polygon(0 100%,50% 0,100% 100%)}
.f-wall{position:absolute;left:10%;right:10%;top:30%;bottom:8%;background:repeating-linear-gradient(#25303A 0 9px,#1E2830 9px 11px)}
.f-fascia{position:absolute;left:4%;right:4%;top:28.5%;height:2.5%;background:#39424B}
.f-door{position:absolute;left:46%;bottom:8%;width:10%;height:30%;background:#152A31;border:1.5px solid #2FB9CB}
.f-win{position:absolute;top:42%;width:16%;height:18%;background:#0F1519;border:1.5px solid #39424B}
.f-gar{position:absolute;right:12.5%;bottom:8%;width:20%;height:26%;background:#1A222A;border:1.5px solid #39424B}
.geo{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.geo .g{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:5px 10px}
.geo .g i{font-style:normal;color:var(--emerald)}
.geo button{font-family:var(--sans);font-size:11.5px;color:var(--amber);background:none;border:1px solid rgba(224,168,60,.45);border-radius:100px;padding:5px 11px;cursor:pointer}
/* cards */
.cards{display:flex;flex-direction:column;gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.rc .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rc .hd b{font-size:16.5px;font-weight:600}
.rc .hd .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rc .hd .x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;font-size:12px;padding:3px 9px;cursor:pointer;font-family:var(--sans)}
.rc .hd .x:hover{border-color:var(--clay);color:var(--clay)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:13px}
.tl{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:13.5px;color:var(--muted);user-select:none}
.tl.on{border-color:var(--cyan);color:var(--text);background:rgba(59,216,233,.07)}
.tl.on::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--cyan);font-size:11px}
.tl .st{display:none;align-items:center;gap:9px;margin-top:7px}
.tl.on .st{display:flex}
.tl .st button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--text);font-size:13px;cursor:pointer;line-height:1}
.tl .st b{font-family:var(--mono);font-size:12px;min-width:16px;text-align:center}
.more{margin-top:10px;background:none;border:none;color:var(--cyan);font-family:var(--sans);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hiddenT{display:none}.showmore .hiddenT{display:block}
.advice{display:none;margin-top:11px;border:1px solid rgba(224,168,60,.5);border-left-width:2.5px;background:rgba(224,168,60,.05);border-radius:0 10px 10px 0;padding:11px 13px;font-size:13px}
.advice.show{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.advice button{font-family:var(--sans);font-size:12.5px;padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer}
.advice .keep{border-color:var(--amber);color:var(--amber)}
.else{display:flex;gap:8px;margin-top:12px}
.else input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:13px;padding:10px 12px;outline:none}
.else button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:9px;padding:0 13px;cursor:pointer;font-size:13px;font-family:var(--sans)}
.notechip{display:none;margin-top:9px;font-size:12px;color:var(--amber);border:1px dashed rgba(224,168,60,.5);border-radius:100px;padding:5px 12px;width:fit-content}
.inc{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}
.inc::before{content:"🔒";font-size:11px}
.seg{display:inline-flex;gap:5px;margin-top:8px}
.seg button{padding:7px 12px;border-radius:100px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12.5px;cursor:pointer;font-family:var(--sans)}
.seg button.on{border-color:var(--cyan);color:var(--cyan)}
.grouplbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);margin:4px 0 -4px}
.addrooms{border:1.5px dashed var(--line);border-radius:14px;padding:15px}
.addrooms .q{font-size:14.5px;font-weight:600;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--sans)}
.chip:hover{border-color:var(--cyan);color:var(--cyan)}
/* sticky bar */
.stick{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:11px 18px;background:rgba(10,11,13,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.stick .row{display:flex;align-items:center;gap:12px;max-width:1020px;margin:0 auto}
.stick .pr{font-family:var(--mono);font-weight:700;font-size:15px;line-height:1.25}
.stick .pr small{display:block;font-size:8px;font-weight:400;color:var(--muted);letter-spacing:.14em}
.stick .sp{flex:1}
.tier{font-size:11.5px;color:var(--muted);max-width:1020px;margin:0 auto 8px;display:flex;gap:7px;align-items:center}
.tier i{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--emerald);flex-shrink:0}
.tier.visit i{background:var(--amber)}
.btn{font-family:var(--sans);font-weight:600;font-size:15px;padding:13px 20px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.b-p{background:var(--cyan);color:var(--oncyan)}
.slots{display:none;gap:8px;margin-top:9px;max-width:1020px;margin-inline:auto;flex-wrap:wrap}
.slots.show{display:flex}
.slots button{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:9px 14px;border-radius:100px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer}
.slots button:hover{border-color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--panel2);border:1px solid rgba(59,216,233,.45);border-radius:12px;padding:10px 16px;font-size:13.5px;opacity:0;transition:opacity .25s;z-index:70;max-width:460px;text-align:center}
.toast.show{opacity:1}
.note{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:16px}
</style>
</head>
<body>

<header class="top">
  <div class="wm">PAINT<span>—</span>GROUP</div>
  <div class="demo">
    <button id="d-int" class="on" onclick="setEx('int')">INTERIOR EXAMPLE</button>
    <button id="d-ext" onclick="setEx('ext')">EXTERIOR EXAMPLE</button>
  </div>
</header>

<main class="wrap">
  <div class="scorebar">
    <div class="score">
      <div class="sc-ring">
        <svg width="48" height="48"><circle cx="24" cy="24" r="20" fill="none" stroke="#242B32" stroke-width="4"/>
        <circle id="scArc" cx="24" cy="24" r="20" fill="none" stroke="#2FA46B" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="11.3"/></svg>
        <div class="num" id="scNum">91%</div>
      </div>
      <div class="lbl"><b>Shape your estimate</b><span>Add or remove anything — we'll reprice as you go</span></div>
    </div>
    <div class="range" id="rngBox"><small id="rngLbl">YOUR ESTIMATE · INCL. GST</small><div class="r" id="rng">—</div></div>
  </div>

  <div class="grid">
    <div class="visual" id="vis"></div>
    <div class="cards" id="cards"></div>
  </div>
  <p class="note">DEMO — FIGURES ILLUSTRATIVE. EVERY CHANGE HERE IS A SCOPE CHANGE; HOURS, RATES AND PREP ALLOWANCES ARE COMPUTED SERVER-SIDE AND NEVER SHOWN OR EDITABLE.</p>
</main>

<div class="stick">
  <div class="tier" id="tier"></div>
  <div class="row">
    <div class="pr"><small>ESTIMATE · INCL. GST</small><span id="stickRng">—</span></div>
    <div class="sp"></div>
    <button class="btn b-p" id="cta" onclick="ctaTap()">Accept estimate</button>
  </div>
  <div class="slots" id="slots">
    <button onclick="book('Thu 9:00 am')">THU · 9:00 AM</button>
    <button onclick="book('Thu 2:00 pm')">THU · 2:00 PM</button>
    <button onclick="book('Fri 10:30 am')">FRI · 10:30 AM</button>
    <button onclick="book('Sat 8:30 am')">SAT · 8:30 AM</button>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let tt;function toast(m){const t=$("#toastEl");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3000)}
const fmt=v=>"$"+Math.round(v).toLocaleString("en-AU");

/* ---------- data ---------- */
const INT_ROOMS=[
 {id:"r1",name:"Living area",m2:"16.0 m²",tiles:[
   {k:"walls",l:"Walls",on:1,v:620},{k:"ceil",l:"Ceiling",on:1,v:380},{k:"corn",l:"Cornices",on:1,v:120},
   {k:"skirt",l:"Skirting",on:1,v:160},{k:"doors",l:"Doors",on:1,v:95,st:1,q:2},{k:"wins",l:"Windows",on:1,v:85,st:1,q:2}],
  more:[{k:"feat",l:"Feature wall",on:0,v:150},{k:"beams",l:"Exposed beams",on:0,v:180},{k:"arch",l:"Architraves",on:0,v:110}]},
 {id:"r2",name:"Bed 1",m2:"11.4 m²",tiles:[
   {k:"walls",l:"Walls",on:1,v:520},{k:"ceil",l:"Ceiling",on:1,v:300},{k:"skirt",l:"Skirting",on:1,v:130},
   {k:"doors",l:"Doors",on:1,v:95,st:1,q:1},{k:"robe",l:"Robe doors",on:0,v:140,st:1,q:2}],
  more:[{k:"corn",l:"Cornices",on:0,v:100},{k:"wins",l:"Windows",on:0,v:85,st:1,q:1},{k:"arch",l:"Architraves",on:0,v:95}]},
 {id:"r3",name:"Bathroom",m2:"3.0 m²",tiles:[
   {k:"ceil",l:"Ceiling · wet-area",on:1,v:220},{k:"doors",l:"Door",on:1,v:95,st:1,q:1}],
  more:[{k:"walls",l:"Walls",on:0,v:300},{k:"wins",l:"Window",on:0,v:85,st:1,q:1}]}
];
const EXT_GROUPS=[
 {g:"THE BODY",items:[{k:"wb",l:"Weatherboards",on:1,v:5200,extent:1}]},
 {g:"TRIMS & OPENINGS",items:[
   {k:"exwin",l:"Windows",on:1,v:120,st:1,q:8},{k:"entry",l:"Entry door",on:1,v:180},
   {k:"gar",l:"Garage door",on:0,v:420}]},
 {g:"THE ROOFLINE",items:[
   {k:"fascia",l:"Fascias",on:1,v:640},{k:"gutter",l:"Gutters",on:1,v:560},
   {k:"eaves",l:"Eaves",on:1,v:520},{k:"dp",l:"Downpipes",on:1,v:180}]},
 {g:"EXTRAS",items:[
   {k:"deck",l:"Deck (oil)",on:0,v:850},{k:"fence",l:"Fence",on:0,v:1200},
   {k:"perg",l:"Pergola",on:0,v:480},{k:"lb",l:"Letterbox",on:0,v:40}]}
];
let ex="int",extFlagged=false,booked=false;
const BASE={int:900,ext:1400}; /* prep + sundries, locked */
const EXTENT={1:{l:"Whole house",f:1},2:{l:"Front only",f:.45},3:{l:"Front + sides",f:.75}};

/* ---------- render ---------- */
function tileHTML(t,rid){
 return `<div class="tl ${t.on?"on":""}" data-r="${rid}" data-k="${t.k}">${t.l}
  ${t.st?`<span class="st"><button data-d="-1">−</button><b>${t.q}</b><button data-d="1">+</button></span>`:""}</div>`;}
function renderInt(){
 $("#vis").innerHTML=`<div class="t"><span>YOUR FLOORPLAN</span><span>SCOPE VIEW</span></div>
  <svg class="plan" viewBox="0 0 300 160">
   <rect class="rm" x="10" y="10" width="130" height="95"/><text x="20" y="26">LIVING · 16.0</text>
   <rect class="rm" x="145" y="10" width="70" height="70"/><text x="152" y="26">BED 1 · 11.4</text>
   <rect class="rm" x="220" y="10" width="70" height="70"/><text x="227" y="26">BATH · 3.0</text>
   <rect class="rm" x="145" y="85" width="145" height="65"/><text x="152" y="101">HALL &amp; ENTRY</text></svg>`;
 $("#cards").innerHTML=INT_ROOMS.map(r=>`
  <div class="rc" id="${r.id}">
   <div class="hd"><b>${r.name}</b><span class="m">${r.m2}<button class="x" onclick="rmRoom('${r.id}','${r.name}')">×</button></span></div>
   <div class="tgrid">${r.tiles.map(t=>tileHTML(t,r.id)).join("")}
     <div class="hiddenT" style="display:contents">${r.more.map(t=>tileHTML(t,r.id)).join("")}</div></div>
   <button class="more" onclick="this.closest('.rc').classList.toggle('showmore');this.textContent=this.closest('.rc').classList.contains('showmore')?'Fewer surfaces':'More surfaces…'">More surfaces…</button>
   <div class="advice" id="adv-${r.id}"><span>Skirting is usually painted with the walls — leave it out?</span>
     <button class="keep" onclick="keepSkirt('${r.id}')">Keep it in</button><button onclick="confirmSkirt('${r.id}')">Leave it out</button></div>
   <div class="else"><input placeholder="Something else in this room? Tell us…" id="else-${r.id}">
     <button onclick="addNote('${r.id}')">Add</button></div>
   <div class="notechip" id="nc-${r.id}"></div>
   <div class="inc">Includes filling minor cracks and sanding — allowances set by us</div>
  </div>`).join("")+`
  <div class="addrooms"><p class="q">Are any rooms missing?</p>
   <div class="chips">${["Bedroom","Kitchen","Laundry","Hallway","Study","Garage"].map(n=>`<button class="chip" onclick="toast('${n} added and priced in — the live build appends the full room card.')">+ ${n}</button>`).join("")}</div></div>`;
 wireTiles();
}
function renderExt(){
 $("#vis").innerHTML=`<div class="t"><span>YOUR HOME · FROM YOUR PHOTOS</span><span>SCOPE VIEW</span></div>
  <div class="facade"><div class="f-roof"></div><div class="f-fascia"></div><div class="f-wall"></div>
   <div class="f-win" style="left:14%"></div><div class="f-win" style="left:34%"></div>
   <div class="f-door"></div><div class="f-gar"></div></div>
  <div class="geo">
   <span class="g">SINGLE STOREY · <i>READ FROM PHOTOS</i></span>
   <span class="g">WALL HEIGHT 2.6 m · <i>CONFIRMED</i></span>
   <button onclick="flagGeo()">Not right? Tell us</button>
  </div>`;
 $("#cards").innerHTML=EXT_GROUPS.map(g=>`
  <p class="grouplbl">${g.g}</p>
  <div class="rc"><div class="tgrid">${g.items.map(t=>tileHTML(t,"ext")).join("")}</div>
   ${g.g==="THE BODY"?`<div class="seg" id="extent">
     <button data-e="1" class="on">Whole house</button><button data-e="2">Front only</button><button data-e="3">Front + sides</button></div>`:""}
   ${g.g==="EXTRAS"?`<div class="else"><input placeholder="Fence length in metres — or type 'not sure'" id="else-fence">
     <button onclick="fenceLen()">Set</button></div><div class="notechip" id="nc-ext"></div>`:""}
   ${g.g==="THE ROOFLINE"?`<div class="inc">Pre-selected — most exterior quotes include the roofline. Untick anything you don't want.</div>`:""}
  </div>`).join("")+`<div class="rc"><div class="inc">Prep, access equipment and sundries are allowed for by us and included in your range</div></div>`;
 wireTiles();
 $$("#extent button").forEach(b=>b.onclick=()=>{$$("#extent button").forEach(o=>o.classList.remove("on"));b.classList.add("on");
  const it=EXT_GROUPS[0].items[0];const old=it.v*EXTENT[it.extent].f;it.extent=+b.dataset.e;
  const nw=it.v*EXTENT[it.extent].f;deltaToast(EXTENT[it.extent].l,nw-old);recalc();});
}
function wireTiles(){
 $$(".tl").forEach(el=>{
  el.onclick=e=>{
   const item=findItem(el.dataset.r,el.dataset.k);
   if(e.target.dataset.d){ /* stepper */
     const d=+e.target.dataset.d,old=item.q;item.q=Math.max(1,Math.min(12,item.q+d));
     if(item.q!==old){el.querySelector(".st b").textContent=item.q;
       const per=item.v*((ex==="ext"&&item.k==="wb")?EXTENT[item.extent].f:1);
       deltaToast(item.l+" ×"+item.q,(item.q-old)*per);recalc();}
     return;}
   item.on=item.on?0:1;el.classList.toggle("on",!!item.on);
   const amt=eff(item);
   deltaToast(item.l,item.on?amt:-amt);
   if(ex==="int"&&item.k==="skirt"&&!item.on){const r=INT_ROOMS.find(r=>r.id===el.dataset.r);
     if(r&&r.tiles.find(t=>t.k==="walls"&&t.on))$("#adv-"+r.id).classList.add("show");}
   recalc();};});
}
function eff(item){const f=(ex==="ext"&&item.k==="wb")?EXTENT[item.extent].f:1;return item.v*(item.st?item.q:1)*f}
function findItem(rid,k){
 if(ex==="int"){const r=INT_ROOMS.find(r=>r.id===rid);return [...r.tiles,...r.more].find(t=>t.k===k)}
 for(const g of EXT_GROUPS){const it=g.items.find(t=>t.k===k);if(it)return it}}
function deltaToast(label,amt){if(!amt)return;
 toast((amt>0?"Added ":"Removed ")+label+" — about "+(amt>0?"+":"−")+fmt(Math.abs(amt)).slice(0)+ (amt>0?" to":" from")+" your range");}
/* ---------- pricing + ladder ---------- */
function total(){
 let s=BASE[ex];
 if(ex==="int")INT_ROOMS.forEach(r=>[...r.tiles,...r.more].forEach(t=>{if(t.on)s+=eff(t)}));
 else EXT_GROUPS.forEach(g=>g.items.forEach(t=>{if(t.on)s+=eff(t)}));
 return s;}
function recalc(){
 const mid=total(),lo=mid*.96,hi=mid*1.04;
 const txt=fmt(lo)+" – "+fmt(hi);
 $("#rng").textContent=txt;$("#stickRng").textContent=txt;
 $("#rngBox").classList.remove("flash");void $("#rngBox").offsetWidth;$("#rngBox").classList.add("flash");
 /* ladder */
 const t=$("#tier"),cta=$("#cta");
 if(booked){t.className="tier visit";t.innerHTML="<i></i>Visit booked — your price is confirmed on the day, then fixed in writing.";return;}
 if(ex==="int"){
  if(mid<=6000){t.className="tier";t.innerHTML="<i></i>Under $6,000 at 91% accuracy — you can accept online. We confirm details before we start.";cta.textContent="Accept estimate";}
  else{t.className="tier visit";t.innerHTML="<i></i>Over $6,000 — the final step is a short visit so we can stand behind every number.";cta.textContent="Confirm my price — book the visit";}
 }else{
  if(!extFlagged&&mid<=12000){t.className="tier";t.innerHTML="<i></i>Straightforward exterior — single storey, photos verified. You can accept online.";cta.textContent="Accept estimate";}
  else{t.className="tier visit";t.innerHTML="<i></i>"+(extFlagged?"You've flagged the geometry — ":"Bigger exterior — ")+"we'll visit to confirm before your price is fixed.";cta.textContent="Confirm my price — book the visit";}
 }
 $("#slots").classList.remove("show");
}
function ctaTap(){
 if($("#cta").textContent.startsWith("Accept")){toast("Accepted — our team gives it a final desk check today, then your fixed price and booking confirmation follow.");return}
 $("#slots").classList.toggle("show");
}
function book(slot){booked=true;$("#slots").classList.remove("show");
 $("#cta").textContent="Visit booked · "+slot;recalc();
 toast("Booked — your estimator arrives with everything you've built here.");}
/* ---------- misc actions ---------- */
function rmRoom(id,name){const i=INT_ROOMS.findIndex(r=>r.id===id);if(i<0)return;
 const val=[...INT_ROOMS[i].tiles,...INT_ROOMS[i].more].reduce((a,t)=>a+(t.on?eff(t):0),0);
 INT_ROOMS.splice(i,1);renderInt();deltaToast(name,-val);recalc();}
function keepSkirt(rid){const r=INT_ROOMS.find(r=>r.id===rid);const t=r.tiles.find(t=>t.k==="skirt");
 t.on=1;$("#adv-"+rid).classList.remove("show");renderInt();recalc();toast("Skirting kept in.")}
function confirmSkirt(rid){$("#adv-"+rid).classList.remove("show");toast("No problem — skirting left out of "+INT_ROOMS.find(r=>r.id===rid).name+".")}
function addNote(rid){const inp=$("#else-"+rid);if(!inp.value.trim())return;
 const nc=$("#nc-"+rid);nc.textContent="⚑ Noted for your estimator: “"+inp.value.trim()+"” — we'll price this with you";
 nc.style.display="inline-block";inp.value="";toast("Added as a note — never priced silently.")}
function fenceLen(){const inp=$("#else-fence"),v=inp.value.trim().toLowerCase();if(!v)return;
 const nc=$("#nc-ext");
 if(v.includes("not")){nc.textContent="⚑ Fence length: not sure — we'll measure it. Your range widens slightly until then.";
  toast("Not a problem — we'll measure on the day.")}
 else{nc.textContent="Fence set to "+v.replace(/[^0-9.]/g,"")+" m";toast("Fence updated — range repriced.")}
 nc.style.display="inline-block";inp.value="";
 const f=EXT_GROUPS[3].items.find(t=>t.k==="fence");if(!f.on){f.on=1;renderExt();}
 recalc();}
function flagGeo(){extFlagged=true;recalc();
 toast("Flagged — geometry is ours to verify, so your estimator will confirm this on site.")}
function setEx(m){ex=m;booked=false;extFlagged=false;
 $("#d-int").classList.toggle("on",m==="int");$("#d-ext").classList.toggle("on",m==="ext");
 m==="int"?renderInt():renderExt();recalc();}
setEx("int");
</script>
</body>
</html>
