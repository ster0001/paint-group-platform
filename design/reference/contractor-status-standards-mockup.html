<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Contractor Traffic Light Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column. A demo strip on top switches between the painter's app and PC Command.
   Dark-first, with a light theme. The build uses the contractor portal's own theme tokens, not these values. */
:root{
  color-scheme:dark;
  --ink:#0A0E11; --graphite:#10161A; --raised:#182026; --line:#27333C; --text:#E9EEF0; --muted:#93A3AC;
  --cyan:#3BD8E9; --on-cyan:#03272D; --paint:#2FB9CB; --amber:#E0A83C; --emerald:#2FA46B; --clay:#B3574A;
  /* text-safe versions of the semantic colours, per theme */
  --t-cyan:#3BD8E9; --t-amber:#E0A83C; --t-green:#35C47E; --clay-text:#E08D7F;
  --t-yellow:#F1CF46; --t-orange:#F08C3A; --t-red:#F0706C; --t-blue:#8FB3F8;
  /* traffic light lamps: the same in both themes, always inside a dark housing */
  --l-green:#35C47E; --l-yellow:#F1CF46; --l-orange:#F08C3A; --l-red:#E5524E; --l-blue:#6C9BF5;
  --lamp-off:#222C33; --housing:#05080A; --housing-line:#27333C; --track:#222C33; --dot-ring:transparent;
  --sans:"Switzer","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --ink:#EDF1F3; --graphite:#F6F8F9; --raised:#FFFFFF; --line:#D3DBE0; --text:#0E1418; --muted:#586872;
  --t-cyan:#0B7785; --t-amber:#8A5E06; --t-green:#1B7A4B; --clay-text:#9B4335;
  --t-yellow:#8A6A00; --t-orange:#B4530A; --t-red:#C0352F; --t-blue:#2F5FD0;
  --housing:#141B20; --housing-line:#141B20; --track:#DCE3E7; --dot-ring:rgba(14,20,24,.28);
} }
:root[data-theme="light"]{
  color-scheme:light;
  --ink:#EDF1F3; --graphite:#F6F8F9; --raised:#FFFFFF; --line:#D3DBE0; --text:#0E1418; --muted:#586872;
  --t-cyan:#0B7785; --t-amber:#8A5E06; --t-green:#1B7A4B; --clay-text:#9B4335;
  --t-yellow:#8A6A00; --t-orange:#B4530A; --t-red:#C0352F; --t-blue:#2F5FD0;
  --housing:#141B20; --housing-line:#141B20; --track:#DCE3E7; --dot-ring:rgba(14,20,24,.28);
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:24px;line-height:1.15;font-weight:700;text-wrap:balance}
h2{font-size:17px;line-height:1.25;font-weight:650;text-wrap:balance}
h3{font-size:15px;font-weight:650}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.eyebrow{font:600 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* demo strip */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--graphite);border-bottom:1px solid var(--line)}
.demo-in{max-width:440px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.demo-row{display:flex;align-items:center;gap:8px;min-width:0}
.demo-row .eyebrow{flex:none}
.demo-row>.chip{flex:none}
.seg{display:flex;flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;appearance:none;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 6px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.chip{flex:none;appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--ink);color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--muted);background:var(--raised)}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--c,var(--track));box-shadow:0 0 0 1px var(--dot-ring)}

/* device */
.wrap{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:16px 0}
.device{display:flex;flex-direction:column;gap:14px;min-height:78vh}
.screen{display:flex;flex-direction:column;gap:14px;flex:1;padding-bottom:20px}
@media(min-width:520px){.wrap{padding-block:24px}.device{border:1px solid var(--line);border-radius:28px;background:var(--graphite);padding:20px 16px 0;overflow:clip}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);font:600 12px var(--mono)}
.back{appearance:none;align-self:flex-start;border:0;background:transparent;color:var(--t-cyan);font-weight:600;font-size:14px;padding:4px 0;cursor:pointer}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plain{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--graphite);color:var(--text);font-weight:600;font-size:14px;padding:11px 14px;border-radius:10px;cursor:pointer;text-align:center}
.btn.pri{background:var(--cyan);color:var(--on-cyan);border-color:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[aria-pressed="true"]{border-color:var(--t-cyan);color:var(--t-cyan)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 130px}
.link{appearance:none;border:0;background:transparent;color:var(--t-cyan);font-weight:600;font-size:13.5px;padding:0;cursor:pointer;text-align:left}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--t-green);border-color:color-mix(in srgb,var(--emerald) 55%,var(--line))}
.pill.wait{color:var(--t-amber);border-color:color-mix(in srgb,var(--amber) 55%,var(--line))}
.pill.bad{color:var(--clay-text);border-color:color-mix(in srgb,var(--clay) 70%,var(--line))}
.pill.info{color:var(--t-cyan);border-color:color-mix(in srgb,var(--paint) 55%,var(--line))}
.pills{display:flex;flex-wrap:wrap;gap:6px}
ul.clean,ol.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* traffic light */
.tl{flex:none;display:flex;flex-direction:column;gap:7px;padding:9px;background:var(--housing);border:1px solid var(--housing-line);border-radius:24px}
.tl.big .lamp{width:44px;height:44px}
.lamp{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--lamp-off));box-shadow:inset 0 2px 5px rgba(0,0,0,.65)}
.lamp.on{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,white),var(--c) 60%);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent),0 0 18px var(--c);animation:pulse 1.9s ease-in-out infinite}
.tl.new{border-color:var(--l-blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--l-blue) 22%,transparent);animation:ring 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent),0 0 12px var(--c);filter:brightness(1)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent),0 0 30px var(--c);filter:brightness(1.18)}}
@keyframes ring{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--l-blue) 22%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--l-blue) 12%,transparent)}}
@media(prefers-reduced-motion:reduce){.lamp.on,.tl.new{animation:none}}
.statuscard{appearance:none;width:100%;text-align:left;cursor:pointer;flex-direction:row;align-items:center;gap:16px}
.statusname{font-size:30px;line-height:1.05;font-weight:700;color:var(--ct)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps i{height:9px;border-radius:5px;background:var(--track)}
.steps i.on{background:var(--emerald)}
.big{font:600 34px/1 var(--mono);font-variant-numeric:tabular-nums}

/* measures and job dots */
.measure{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.measure .dot{grid-row:span 2;width:14px;height:14px}
.measure b{font-weight:650}
.jobs{display:flex;gap:5px}
.jd{appearance:none;flex:1;min-width:0;max-width:30px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--mono);cursor:pointer;padding:0;border:2px solid transparent}
.jd.ok{background:var(--emerald);color:#04150C}
.jd.slip{background:transparent;border-color:var(--clay);color:var(--clay-text)}
.jd.todo{background:transparent;border:2px dashed var(--line);color:var(--muted);cursor:default}
.jd[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:2px}
.tick{color:var(--t-green);font-weight:700} .cross{color:var(--clay-text);font-weight:700}
.perk{display:flex;gap:10px;align-items:flex-start}
.perk .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--mono);background:var(--graphite);border:1px solid var(--line);color:var(--muted)}
.perk.on .ic{background:var(--emerald);border-color:transparent;color:#04150C}
.perk.off{color:var(--muted)}
.colourkey{display:grid;grid-template-columns:auto 1fr;gap:10px 10px;align-items:start}
details.card{display:block}
details.card>*:not(summary){margin-top:10px}
details.card>summary{cursor:pointer;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.card[open]>summary::after{content:"–"}

/* standards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{appearance:none;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.tile::after{content:"›";color:var(--muted)}
.listbtn{appearance:none;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;font-weight:600;font-size:14.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.listbtn:last-child{border-bottom:0}.listbtn::after{content:"›";color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:12px;margin:0}
.rows dt{font:600 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t-cyan);margin-bottom:3px}
.rows dd{margin:0}
.lv{display:inline-block;font:600 10.5px/1 var(--mono);padding:3px 5px;border-radius:5px;background:var(--graphite);border:1px solid var(--line);color:var(--muted);margin-right:6px}
.every{border-color:color-mix(in srgb,var(--paint) 45%,var(--line))}
.note{border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:14px}
.r3 p{margin-top:5px}
.check{appearance:none;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:600;cursor:pointer}
.check .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font:700 14px/1 var(--mono);color:transparent}
.check[aria-checked="true"]{border-color:var(--emerald)}
.check[aria-checked="true"] .box{background:var(--emerald);border-color:var(--emerald);color:#04150C}
.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.progress i{height:5px;border-radius:3px;background:var(--track)}.progress i.on{background:var(--paint)}

/* tab bar */
.tabbar{position:sticky;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--graphite);border-top:1px solid var(--line);margin-inline:-16px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));margin-top:auto}
.tabbar button{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabbar button[aria-current="page"]{color:var(--on-cyan);background:var(--cyan)}

/* PC command */
.q{border-color:var(--line)}
.q.crit{border-color:color-mix(in srgb,var(--clay) 75%,var(--line))}
.q.warn{border-color:color-mix(in srgb,var(--amber) 60%,var(--line))}
.q.info{border-color:color-mix(in srgb,var(--paint) 55%,var(--line))}
.result{background:var(--graphite);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lane{min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.lane.cb{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;border-color:var(--clay);background:color-mix(in srgb,var(--clay) 14%,var(--raised))}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini b{font:600 13px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.lane b{font:600 22px/1 var(--mono)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:600 22px/1 var(--mono)}
.lights{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lightcount{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.lightcount b{font:600 20px/1 var(--mono)}
.lightcount .dot{width:14px;height:14px}
.crow{appearance:none;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.crow[aria-expanded="true"]{border-color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font:600 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{background:var(--graphite);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:10px 12px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.sheet{border-color:var(--paint)}
</style>

</head>
<body>
<div class="demo" id="demo"></div>
<main class="wrap"><div class="device" id="app"></div></main>
<script>
/* ---------- Finish standards content (from the approved painter guide) ---------- */
const LV = {
  2: { n: "Clean, tidy repaint", d: "3 m" },
  3: { n: "Our standard finish", d: "1.5 m" },
  4: { n: "Premium finish", d: "0.5 m" }
};
const LEVEL_ROWS = [
  ["Filling", "All holes, nail holes and open cracks. Small marks in the old surface can stay.", "Every mark you can see from 1.5 m.", "Every mark you can see from 0.5 m."],
  ["Sanding", "Light sand. Remove loose paint and dust.", "Sand well. Smooth to touch.", "Sand smooth before the first coat and between coats."],
  ["Gaps (caulking)", "Edges of frames and trim.", "Edges, mitres and corners.", "Every gap and join."],
  ["Old problems", "Old runs, old paint on glass and old brush marks can stay.", "Fix what you can see from 1.5 m.", "Fix all of them."],
  ["Look test", "Stand 3 m back.", "Stand 1.5 m back.", "Stand 0.5 m back (arm's length)."]
];
const LOOK_TEST = [
  "First, do everything in the list for the surface. The list is the rule.",
  "Then stand back at the distance for the level on your work order.",
  "Look straight at the surface in normal light: daylight, or the room lights on. Do not use a torch.",
  "If you can see a problem from that distance, fix it."
];
const RULES = [
  ["No drips or runs", "No drips, runs or sags on any painted surface."],
  ["No paint where it should not be", "No paint on floors, carpet, tiles, benchtops, cupboards, furniture, switches, power points, lights, paths, driveways, decks, roofs, plants or cars."],
  ["No paint on hardware", "No paint on handles, hinges, locks, latches, window winders or door stops. Remove the hardware or mask it."],
  ["Protect first", "Cover floors and furniture with drop sheets and plastic before you start."],
  ["Full cover", "No missed spots, no thin patches and no old colour showing through."],
  ["Clean finish", "No dust, hair, grit or brush hairs stuck in the paint."],
  ["Clean site every day", "Remove job rubbish every day. Leave your materials tidy before you go."],
  ["Clean site at the end", "Remove all tape, plastic, drop sheets, empty tins and rubbish. Clean up sanding dust. Put back any hardware or cover plates you removed."]
];
const PREP_INT = ["Cover floors and furniture.", "Scrape loose and flaking paint.", "Fill holes, nail holes, cracks and dents to the level on your work order.", "Fill gaps with gap filler to the level on your work order.", "Sand to the level on your work order.", "Sand and clean glossy surfaces so new paint will stick.", "Prime all filler and bare patches."];
const PREP_EXT = ["Wash or clean the surface. Paint only clean, dry surfaces.", "Scrape and sand loose and peeling paint.", "Fill holes and cracks in timber to the level on your work order.", "Fill gaps with exterior gap filler to the level on your work order.", "Sand to the level on your work order.", "Prime all bare timber and bare patches.", "Protect paths, plants and anything not being painted."];
const EXTRA = [
  ["Bogging", "Heavy repairs with two-part filler (builder's bog). Normal filler cannot do this job.", "Rotten timber on sills, fascias and weatherboards. Deep holes. Broken corners and edges."],
  ["Stain blocking", "Sealing a stain with stain-block primer, so it does not come through the new paint.", "Water stains on ceilings. Smoke and nicotine. Timber stain (tannin) bleeding through. Mould marks after cleaning. Pen and marker."],
  ["Additional coats", "More coats than normal, so the new colour covers fully.", "A big colour change, dark to light or light to dark. Bare or new surfaces that need a primer or undercoat. Colours that cover poorly, such as strong yellows and reds."]
];
const VARIATION = ["Stop before you do the extra work.", "Take clear photos of the problem.", "Raise a variation in your portal. Say what the problem is and how many extra hours it needs.", "Wait for us to approve it. The customer must agree to the extra cost first.", "Do the work when the variation is approved."];
const DEFECT_STEPS = ["Finish all painting and clean the site.", "Walk through every room, or every side of the house, on your own.", "Do the look test on every surface, at the distance for the level on your work order.", "Put a small piece of painter's tape next to every defect you find.", "Fix every taped defect. Take the tape off as you fix each one.", "Check that all tape is gone. The job is now ready for the final walk-through."];
const DEFECT_WHY = ["Fewer defects are found at the final walk-through.", "The customer sees that we are one step ahead.", "You finish the job in one visit and you do not have to come back."];
const DEFECTS = [
  ["Paint faults", "Runs, drips, sags, missed spots, thin patches, old colour showing through, roller lines, patchy areas."],
  ["Preparation not done to the level", "Holes, cracks or gaps not filled. Filler not sanded flat. Rough areas not sanded."],
  ["Lines", "Wavy or untidy lines between colours, at ceilings, trim and glass."],
  ["Paint in the wrong place", "Paint on glass, hardware, floors, switches, power points, paths or furniture."],
  ["Dirt in the finish", "Dust, hair, grit or brush hairs stuck in the paint."],
  ["Things that do not work", "Windows or doors stuck with paint. Hardware or cover plates not put back."]
];
const CHECKLIST = ["Every surface on the work order is painted, with the number of coats on the work order.", "Preparation on every surface matches the level on the work order.", "No drips, runs, missed spots or patchy areas.", "No paint on glass, hardware, floors, switches, paths or anything not being painted.", "All windows and doors open and close.", "All hardware and cover plates are back in place.", "You have found and fixed your own defects. If you used tape, all tape is removed.", "The site is clean: no rubbish, no tape, no plastic, no dust."];
const WORDS = [
  ["Level", "The standard of preparation and finish for the job: 2, 3 or 4. It is on your work order."],
  ["Look test", "Stand back at the distance for the level. If you can see a problem, fix it."],
  ["Fill", "Put filler in holes, dents and cracks, then sand it flat."],
  ["Gap filler (caulk)", "Flexible filler for gaps and joins between two surfaces."],
  ["Bog", "Strong two-part filler for heavy repairs, such as rotten timber."],
  ["Mitre", "The corner join where two pieces of trim meet at an angle."],
  ["Prime", "A first coat on bare timber, bare patches or filler, so the top coats stick and cover evenly."],
  ["Stain block", "A special primer that stops a stain coming through new paint."],
  ["Sand the edges soft", "Sand the edge of old paint or filler until you cannot feel a step. Also called feathering."],
  ["Hardware", "Handles, locks, latches, hinges, winders and door stops."],
  ["Defect", "Anything that does not meet the standard for the level."],
  ["Variation", "Extra paid work that is not on your work order. It must be approved before you do it."]
];

function light(st, big) {
  const order = ["red", "orange", "yellow", "green"];
  return `<div class="tl ${big ? "big" : ""} ${st === "blue" ? "new" : ""}" role="img" aria-label="Traffic light showing ${NAME[st]}">` +
    order.map(k => `<div class="lamp ${k === st ? "on" : ""}" style="--c:${LAMP[k]}"></div>`).join("") + `</div>`;
}
function stepsToGreen(p) {
  const n = Math.min(p.streak, 4);
  return `<div class="plain"><div class="row"><div class="eyebrow grow">Steps to Green</div><div class="num small">${n} of 4</div></div>
    <div class="steps">${[0, 1, 2, 3].map(i => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>
    <p class="small muted">${n >= 4 ? "Done." : (4 - n) + " more clean " + (4 - n === 1 ? "job" : "jobs") + " in a row to reach Green."}</p></div>`;
}
function jobsOf(st) {
  const p = PROFILE[st];
  return ADDR.slice(0, st === "blue" ? 4 : 10).map((a, i) => i < p.count ? { addr: a[0], hrs: a[1], why: p.slips[i] || null } : null);
}

        <div class="row">${dot(c.st)}<b class="grow">${c.n}</b><span class="small muted">${NAME[c.st]}</span><span class="num" title="${arrowLabel[c.tr]}" aria-label="${arrowLabel[c.tr]}">${arrow[c.tr]}</span></div>
        <div class="mini">${[["Checks", none ? "–" : c.ch], ["App", none ? "–" : c.app], ["Call backs", c.cb], ["Streak", c.streak]].map(([l, v]) => `<span><span class="eyebrow">${l}</span><b>${v}</b></span>`).join("")}</div>
        ${c.tags.length ? `<div class="pills">${c.tags.map(([t, k]) => `<span class="pill ${k}">${t}</span>`).join("")}</div>` : ""}
      </button>${openRow ? `<div class="card sheet">
        <div class="eyebrow">${c.n} · last 10 jobs</div>
        <div class="jobs">${jobs.map((j, i) => j && c.app !== "No jobs yet" ? `<span class="jd ${j.why ? "slip" : "ok"}">${j.why ? "!" : "✓"}</span>` : `<span class="jd todo">${i + 1}</span>`).join("")}</div>
        <p class="small muted">${c.app === "No jobs yet" ? "No finished jobs yet. He cannot be offered work until he signs the standards." : pr.line.replace("Your", "Their").replace("your", "their")}</p>
        ${c.n === "Li W." ? `<p class="small"><b>Bonus history (staff only):</b> <span class="num">$500</span> on 2 Sep 2026.</p>` : ""}
        ${P.spot ? `<div class="result"><span class="tick">✓</span> Spot check added to ${c.n}'s current job.</div>` : ""}
        <div class="btns"><button class="btn" data-a="spot">Spot check</button><button class="btn" data-a="pc-tab" data-v="callbacks">Log call back</button></div>
      </div>` : ""}`;
    }).join("")}</div>
    <p class="small muted">Scores, lights and bonus amounts are never shown to customers. Painters see their own light only.</p>
  </div>` + pcTabs();
}
function pcCallbacks() {
  const P = S.pc, qc = P.qc, cu = P.cust, sc = P.sched;
  return `<div class="screen">
    <div class="top"><div><div class="eyebrow">PC Command</div><h1>Logging a call back</h1></div></div>
    <p class="muted">Four ways in. All four create the same call back record against the painter who did the job.</p>

    <div class="card"><div class="eyebrow">1 · Quality check</div><h3>4 Boronia Ave · Dan K.</h3>
      <div class="field"><span class="lab">Result</span><div class="btns"><button class="btn" data-a="qc-res" data-v="pass" aria-pressed="${qc.res === "pass"}">Pass</button><button class="btn" data-a="qc-res" data-v="fail" aria-pressed="${qc.res === "fail"}">Fail</button></div></div>
      ${qc.res === "pass" ? `<div class="result"><span class="tick">✓</span> Passed first time.</div>` : ""}
      ${qc.res === "fail" ? `<div class="card sheet"><h3>Can the contractor rectify today, or is it a call back?</h3>
        ${qc.choice === "today" ? `<div class="result"><span class="tick">✓</span> Recorded as a failed check, fixed the same day. Not a call back.</div>`
        : qc.choice === "cb" && qc.date ? `<div class="result"><span class="tick">✓</span> Call back logged against Dan K. Return visit added to his scheduler for ${qc.date}.</div>`
        : qc.choice === "cb" ? dateChips("qc-date", qc.date)
        : `<div class="btns"><button class="btn" data-a="qc" data-v="today">Fixed today</button><button class="btn pri" data-a="qc" data-v="cb">Call back</button></div>`}</div>` : ""}
    </div>

    <div class="card"><div class="eyebrow">2 · Final walk-through</div><h3>Appears as a card in Command</h3>
      <p class="small muted">The walk-through runs on the painter's phone, so Felipe answers the question, not the painter.</p>
      <button class="link" data-a="pc-tab" data-v="command">See the card in Command ›</button></div>

    <div class="card"><div class="eyebrow">3 · Property page</div>
      <div class="row"><div class="grow"><h3>31 Correa St</h3><p class="small muted">Sam T. · signed off Mon 5 Oct · day 2 of 7</p></div><span class="pill ok">Closed</span></div>
      ${cu.done ? `<div class="result"><p><span class="tick">✓</span> Call back logged against Sam T.</p>
          <ul class="clean small" style="margin-top:6px"><li>${cu.reason === "work" ? "Workmanship, inside 7 days of sign-off: it counts toward his score." : "Not workmanship: it is logged but does not count toward his score."}</li><li>Return visit added to his scheduler for ${cu.date}.</li><li>Invoice chasing and reminders are paused until it is closed.</li></ul></div>`
      : cu.open ? `<div class="card sheet">
          <div class="field"><label for="cb-date">Date the customer called</label><input id="cb-date" value="Wed 7 Oct 2026" readonly></div>
          <div class="field"><label for="cb-text">What is wrong</label><textarea id="cb-text" data-bind="cust-text">${cu.text}</textarea></div>
          <div class="field"><span class="lab">Reason</span><div class="seg"><button data-a="cu-reason" data-v="work" aria-pressed="${cu.reason === "work"}">Workmanship</button><button data-a="cu-reason" data-v="other" aria-pressed="${cu.reason === "other"}">Not workmanship</button></div></div>
          ${dateChips("cu-date", cu.date)}
          <div class="btns"><button class="btn pri" data-a="cu-save">Log call back</button></div></div>`
      : `<div class="btns"><button class="btn pri" data-a="cu-open">Customer called back</button></div>`}
    </div>

    <div class="card"><div class="eyebrow">4 · Scheduler</div><h3>New appointment</h3>
      <div class="field"><label for="sc-addr">Address</label><input id="sc-addr" value="31 Correa St" readonly></div>
      <div class="field"><label for="sc-who">Painter and day</label><input id="sc-who" value="Sam T. · Thu 8 Oct" readonly></div>
      <button class="check" role="checkbox" aria-checked="${sc.wt}" data-a="sc-wt"><span class="box">✓</span><span>Walk-through not required</span></button>
      <button class="check" role="checkbox" aria-checked="${sc.cb}" data-a="sc-cb"><span class="box">✓</span><span>Call back</span></button>
      ${sc.cb ? `<p class="small muted">Ticking Call back links this visit to the finished job at this address. If a call back is already open there, it joins that one, so nothing is counted twice.</p>` : ""}
      ${sc.done ? `<div class="result"><span class="tick">✓</span> Appointment saved${sc.cb ? " and linked to the open call back at 31 Correa St" : ""}.</div>` : `<div class="btns"><button class="btn pri" data-a="sc-save">Save appointment</button></div>`}
    </div>
  </div>` + pcTabs();
}
const PC = { command: pcCommand, flow: pcFlow, contractors: pcContractors, callbacks: pcCallbacks };

/* ---------- Demo strip, actions, boot ---------- */
function demoBar() {
  const painter = S.view === "painter";
  return `<div class="demo-in">
    <div class="demo-row"><div class="seg"><button data-a="view" data-v="painter" aria-pressed="${painter}">Painter app</button><button data-a="view" data-v="pc" aria-pressed="${!painter}">PC Command</button></div><button class="chip" data-a="theme" aria-label="Switch to ${theme() === "dark" ? "light" : "dark"} mode">${theme() === "dark" ? "Light mode" : "Dark mode"}</button></div>
    ${painter ? `<div class="demo-row"><span class="eyebrow">Status</span><div class="chips">${["blue", "green", "yellow", "orange", "red"].map(k => `<button class="chip" data-a="status" data-v="${k}" aria-pressed="${S.status === k}">${dot(k)}${NAME[k]}</button>`).join("")}</div></div>
    <div class="demo-row"><span class="eyebrow">Viewer</span><div class="chips"><button class="chip" data-a="role" data-v="contractor" aria-pressed="${S.role === "contractor"}">Contractor</button><button class="chip" data-a="role" data-v="lead" aria-pressed="${S.role === "lead"}">Employed lead painter</button></div></div>`
    : `<div class="demo-row"><span class="eyebrow">Sample data</span><span class="small muted">Names, addresses and numbers are examples.</span></div>`}
  </div>`;
}
const root = document.documentElement, hostTheme = root.getAttribute("data-theme");
const theme = () => root.getAttribute("data-theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
let scrollTop = false;
const go = s => { S.screen = s; scrollTop = true; };
const ACT = {
  view: v => { S.view = v; scrollTop = true; },
  theme: () => { root.setAttribute("data-theme", theme() === "dark" ? "light" : "dark"); },
  status: v => { S.status = v; S.jobSel = null; if (!["home", "status"].includes(S.screen)) go("status"); },
  role: v => { S.role = v; if (!["home", "status"].includes(S.screen)) go("status"); },
  go: v => { if (v === "standards") S.std.locked = false; go(v); },
  "job-dot": v => { S.jobSel = S.jobSel === +v ? null : +v; },
  side: v => { S.std.side = v; },
  surface: v => { S.std.surface = v; S.std.locked = false; go("surface"); },
  expect: v => { S.std.surface = v; S.std.level = 3; S.std.locked = true; go("surface"); },
  unlock: () => { S.std.locked = false; },
  level: v => { S.std.level = +v; },
  section: v => { S.std.section = v; go("section"); },
  "sign-start": () => { S.sign = { step: -1, ticks: [false, false, false, false, false, false], confirmed: true }; go("signoff"); },
  "sign-tick": () => { S.sign.ticks[S.sign.step] = !S.sign.ticks[S.sign.step]; },
  "sign-next": () => { S.sign.step++; scrollTop = true; },
  "sign-back": () => { S.sign.step--; scrollTop = true; },
  "pc-tab": v => { S.pc.tab = v; scrollTop = true; },
  "pc-open": v => { S.pc.tab = "contractors"; S.pc.row = v; S.pc.spot = false; scrollTop = true; },
  "pc-row": v => { S.pc.row = S.pc.row === v ? null : v; S.pc.spot = false; },
  spot: () => { S.pc.spot = true; },
  wt: v => { S.pc.wt.choice = v; }, "wt-date": v => { S.pc.wt.date = v; },
  bonus: () => { S.pc.bonus = true; }, nudge: () => { S.pc.nudge = true; },
  "cb-toggle": v => { S.pc.openCb = v === "1"; },
  "qc-res": v => { S.pc.qc = { res: v, choice: null, date: null }; }, qc: v => { S.pc.qc.choice = v; }, "qc-date": v => { S.pc.qc.date = v; },
  "cu-open": () => { S.pc.cust.open = true; }, "cu-reason": v => { S.pc.cust.reason = v; }, "cu-date": v => { S.pc.cust.date = v; }, "cu-save": () => { S.pc.cust.done = true; },
  "sc-wt": () => { S.pc.sched.wt = !S.pc.sched.wt; S.pc.sched.done = false; }, "sc-cb": () => { S.pc.sched.cb = !S.pc.sched.cb; S.pc.sched.done = false; }, "sc-save": () => { S.pc.sched.done = true; }
};
function render() {
  $("#demo").innerHTML = demoBar();
  $("#app").innerHTML = S.view === "painter" ? PAINTER[S.screen]() : PC[S.pc.tab]();
  if (scrollTop) { window.scrollTo(0, 0); scrollTop = false; }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a];
  if (fn) { fn(el.dataset.v, el); render(); }
});
document.addEventListener("input", e => { if (e.target.dataset.bind === "cust-text") S.pc.cust.text = e.target.value; });
render();

</script>
</body>
