<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paint Home — exterior v5</title>
<style>
:root{--ink:#1c232c;--grey:#5c6672;--mute:#98a2ad;--line:#e6eaee;--bg:#f7f8f9;--card:#fff;--teal:#2fd3df;--teal-ink:#0e7f8a;--teal-soft:#e4f8fa;--green:#5f9a73;--green-soft:#edf4ee;--mono:ui-monospace,"Martian Mono",Menlo,monospace;--r:16px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Inter",system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px}
button{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0}
.logo{font-weight:800;letter-spacing:.06em;font-size:13px}.logo span{color:var(--teal-ink)}
.back{width:40px;height:40px;border:0;background:transparent;border-radius:50%;font-size:22px;line-height:1;margin-left:-10px;color:var(--grey)}
.back[disabled]{opacity:0;pointer-events:none}
.help{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.bar{height:3px;background:var(--line);margin:14px 20px 0;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .35s ease}
.strip{display:flex;align-items:center;gap:12px;margin:12px 20px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;text-align:left;width:calc(100% - 40px)}
.strip .thumb{width:86px;height:52px;border-radius:9px;overflow:hidden;background:#eef2f5;flex:0 0 auto}
.strip .thumb svg{width:100%;height:100%;display:block}
.strip .txt{flex:1;min-width:0;font-size:12px;color:var(--mute);line-height:1.35}
.strip .txt b{display:block;font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .chev{color:var(--mute);font-size:20px;padding-right:2px}
.strip.hide{display:none}
main{flex:1;padding:18px 20px 130px;position:relative}
.screen{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:27px;line-height:1.15;letter-spacing:-.015em;margin:10px 0 6px;font-weight:700}
.sub{color:var(--grey);font-size:15px;margin:0 0 20px;line-height:1.45}
.stage{font-size:12px;color:var(--teal-ink);font-weight:600;margin-top:4px}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;text-align:left;width:100%;min-height:64px;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--teal-ink);background:var(--teal-soft)}
.opt .t{font-weight:600;font-size:16px;line-height:1.2}.opt .d{font-size:13px;color:var(--grey);margin-top:3px}
.opts.two .opt{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px 14px}
.opt .sil{width:100%;height:54px}.opt .sil svg{width:100%;height:100%}
.pills{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pills .opt{justify-content:center;padding:0;height:60px;font-weight:600;font-size:14px;flex-direction:column;gap:2px}.pills .opt small{font-weight:500;font-size:10px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:12px 16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.chip.sel{border-color:var(--teal-ink);background:var(--teal-soft)}
.chip.sel:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal-ink)}
.chip.add{border-style:dashed;color:var(--grey);font-weight:500}
.chip.off{opacity:.45}
.grp{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 8px}
.field{display:block;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 16px 12px;margin-bottom:10px}
.field span{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.field input{border:0;outline:0;width:100%;font:inherit;font-size:17px;padding:4px 0;background:transparent;color:var(--ink)}
.field:focus-within{border-color:var(--teal-ink)}
.step{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.step .l{font-size:15px;font-weight:600}.step .l small{display:block;font-weight:400;color:var(--grey);font-size:12px}
.stp{display:flex;align-items:center;gap:10px}.stp button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:18px}.stp b{min-width:24px;text-align:center;font-family:var(--mono)}
.toggle{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;margin:14px 0 0;font-size:14px;font-weight:600}
.toggle i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}.toggle i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on i{background:var(--teal-ink)}.toggle.on i:after{left:21px}
.sidetabs{display:flex;gap:6px;margin:0 0 14px}.sidetabs span{flex:1;text-align:center;font-size:12px;font-weight:600;padding:8px 0;border-radius:999px;border:1.5px solid var(--line);color:var(--grey)}
.sidetabs span.now{border-color:var(--teal-ink);color:var(--teal-ink);background:var(--teal-soft)}.sidetabs span.done{background:var(--green);border-color:var(--green);color:#fff}.sidetabs span.np{opacity:.4}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 20px calc(16px + env(safe-area-inset-bottom));display:none}
.foot.on{display:block}
.cta{display:block;width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;padding:18px;text-align:center}
.cta.teal{background:var(--teal);color:var(--ink)}.cta[disabled]{opacity:.35}
.cta small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:3px}
.hint{text-align:center;font-size:12px;color:var(--mute);margin-top:10px}
/* gate */
.label{font-size:13px;color:var(--teal-ink);font-weight:600}
.price{font:700 38px/1 var(--mono);letter-spacing:-.03em;margin:8px 0 10px}
.basis{font-size:15px;color:var(--grey);line-height:1.45;margin:0 0 14px}
.fine{font-size:12px;color:var(--mute);line-height:1.5;margin:0 0 24px}
.ask{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
.ask-sub{color:var(--grey);font-size:15px;line-height:1.45;margin:0 0 16px}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:24px 0 8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;font-size:12px;line-height:1.35;color:var(--grey)}
.tile b{display:block;color:var(--ink);font-size:13px;margin:6px 0 2px}
.tile .k{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1.5px solid var(--line)}
.tile.done .k{background:var(--green);border-color:var(--green);color:#fff}.tile.now{border-color:var(--teal-ink)}.tile.now .k{background:var(--teal-soft);border-color:var(--teal-ink);color:var(--teal-ink)}
.alt{text-align:center;font-size:14px;color:var(--grey);margin:14px 0 0}.alt a{color:var(--teal-ink);font-weight:600;text-decoration:underline}
.sarah{display:flex;align-items:center;gap:12px;margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--grey)}.sarah b{color:var(--ink);display:block}
.av{width:40px;height:40px;border-radius:50%;background:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink);flex:0 0 auto}
.trust{font-size:13px;color:var(--mute);margin:18px 0 0}
.incl{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.incl summary{font-weight:600;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}.incl summary:after{content:"›";color:var(--mute);transform:rotate(90deg)}.incl[open] summary:after{transform:rotate(-90deg)}
.incl ul{margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--grey)}.incl li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.incl li span{font:600 11px var(--mono);color:var(--teal-ink)}
.rows{margin:0 0 18px;padding:0;list-style:none;font-size:13px}.rows li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);color:var(--grey)}.rows li b{color:var(--ink);font-weight:600}.rows li span{font:600 12px var(--mono);color:var(--ink)}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(28,35,44,.4);display:none;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));z-index:41;display:none;max-height:88vh;overflow:auto}
.sheet.open,.sheet-bg.open{display:block}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}.srow small{display:block;font-weight:400;color:var(--grey);font-size:12px}.srow:last-child{border:0}
.bigpic{border-radius:14px;overflow:hidden;background:#eef2f5;aspect-ratio:5/3}.bigpic svg{width:100%;height:100%;display:block}
.compass{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}.compass span{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--grey)}.compass span.now{border-color:var(--teal-ink);color:var(--teal-ink);background:var(--teal-soft)}
.sheet .cap{font-size:13px;color:var(--grey);margin:8px 0 6px}
.sheet .chips{margin-top:8px}.sheet .chip{padding:10px 14px;font-size:14px}
.pic .base{fill:#e4e8ec;stroke:#cfd5db;stroke-width:1}
.pic .trimbase{fill:#dfe3e7;stroke:#c9cfd5;stroke-width:1}
.pic .roller{opacity:0;transition:opacity .15s}.pic .roller.on{opacity:1}
@media (min-width:900px){body{background:#eef1f4}.app{max-width:1040px;margin:0 auto;background:var(--bg);min-height:100vh}header{padding:22px 48px 0}.bar{margin:18px 48px 0}.strip{margin:16px 48px 0;width:auto;max-width:544px}main{padding:40px 48px 140px;max-width:640px}.foot{position:static;background:none;padding:28px 0 0;max-width:544px;margin-left:48px}.foot.on{display:block}}
</style>
</head>
<body>
<div class="app">
  <header><button class="back" id="back">‹</button><div class="logo">PAINT <span>HOME</span></div><button class="help" onclick="openContact()">Contact</button></header>
  <div class="bar"><i id="bar"></i></div>
  <button class="strip" id="strip" onclick="openSheet('pic')"><div class="thumb" id="thumb"></div><div class="txt"><b id="strip-b">Your place</b><span id="strip-s">Updates as you answer · tap to see</span></div><div class="chev">›</div></button>
  <main id="main"></main>
  <div class="foot" id="foot"><button class="cta" id="next">Continue</button><div class="hint" id="hint"></div></div>
</div>
<div class="sheet-bg" id="sbg" onclick="closeSheets()"></div>
<div class="sheet" id="sheet-pic"><div class="grab"></div><div class="bigpic" id="bigpic"></div><div class="compass" id="compass"></div><div class="cap" id="bigcap"></div><div class="chips" id="bigchips"></div></div>
<div class="sheet" id="sheet-contact"><div class="grab"></div>
  <div id="c-menu"><div class="srow" style="border:0;padding-top:4px"><span class="av">SR</span><div>Sarah Reid<small>Your estimator for Northcote</small></div></div>
  <button class="cta teal" style="margin:8px 0 14px" onclick="bookStart()">Book a visit<small>Sarah comes to you. About 40 minutes, no charge.</small></button>
  <a class="srow" href="tel:0388409414" style="text-decoration:none;color:inherit">Call 03 8840 9414<small>Mon–Fri, 8–6</small></a><div class="srow">Send a message<small>We reply the same day</small></div><div class="srow">Save and come back later<small>We text you the link</small></div></div>
  <div id="c-form" style="display:none"><h1 style="font-size:22px;margin:4px 0 6px">Book a visit</h1><p class="sub" style="margin-bottom:16px">Just a name and a mobile. Sarah texts you to confirm.</p><label class="field"><span>Name</span><input id="c-name" placeholder="First name is fine"></label><label class="field"><span>Mobile</span><input id="c-mobile" placeholder="04" inputmode="tel"></label><button class="cta" id="c-next" disabled onclick="bookSlots()" style="margin-top:6px">Choose a time</button></div>
  <div id="c-slots" style="display:none"><h1 style="font-size:22px;margin:4px 0 6px">When suits?</h1><p class="sub" style="margin-bottom:14px">Sarah is in Northcote on these days.</p><div class="opts" id="slot-list"></div></div>
  <div id="c-done" style="display:none;text-align:center;padding:10px 0 6px"><div class="av" style="width:56px;height:56px;margin:0 auto 12px;font-size:16px">SR</div><h1 style="font-size:22px;margin:0 0 6px">Booked</h1><p class="sub" id="c-done-sub" style="margin-bottom:16px"></p><button class="cta" onclick="closeSheets()">Keep going with my range</button></div>
</div>

<script>
/* ================= data ================= */
const SHAPES={
 wb:{name:'Weatherboard home',storeys:1,roof:'hip',front:11,side:14,h:2.7,rise:0,wall:'boards',painted:true,shared:[],ver:'porch'},
 cal:{name:'Californian bungalow',storeys:1,roof:'gable',front:12,side:16,h:3.0,rise:2.4,wall:'boards',painted:true,shared:[],ver:'columns'},
 brick:{name:'Brick veneer home',storeys:1,roof:'hip',front:12,side:15,h:2.5,rise:0,wall:'brick',painted:false,shared:[],ver:null},
 ds:{name:'Double-storey home',storeys:2,roof:'hip',front:12,side:14,h:5.6,rise:0,wall:'render',painted:true,shared:[],ver:null},
 th:{name:'Townhouse',storeys:2,roof:'hip',front:7,side:14,h:5.6,rise:0,wall:'render',painted:true,shared:['left','right'],ver:null},
 unit:{name:'Unit or villa',storeys:1,roof:'hip',front:9,side:12,h:2.5,rise:0,wall:'brick',painted:false,shared:['left'],ver:null},
 terrace:{name:'Period terrace',storeys:1,roof:'parapet',front:6,side:16,h:3.6,rise:0.9,wall:'render',painted:true,shared:['left','right'],ver:'iron'},
 modern:{name:'Modern home',storeys:1,roof:'skillion',front:12,side:14,h:3.0,rise:1.1,wall:'sheet',painted:true,shared:[],ver:null},
 other:{name:'Something else',storeys:1,roof:'hip',front:12,side:14,h:2.7,rise:0,wall:'boards',painted:true,shared:[],ver:null},
};
const SIZES=[['sm','Small','≤120 m²',100],['md','Medium','120–200',160],['lg','Large','200–300',250],['xl','Very large','300+',340],['ns','Not sure','',160]];
const MATS={boards:'Weatherboards',render:'Render',brick:'Brick',stucco:'Stucco',sheet:'Cement sheet / panel',colorbond:'Colorbond / metal',vt:'Vertical timber',concrete:'Concrete / tilt slab'};
const PARTS={walls:'The walls',gable:'Gable ends',fascias:'Fascias',gutters:'Gutters',downpipes:'Downpipes',eaves:'Eaves',windows:'Windows',doors:'Doors',garage:'Garage door',shutters:'Window shutters',verandah:'Verandah or porch',posts:'Posts or columns',vceiling:'Verandah ceiling',handrail:'Handrail',fence:'Fence',deck:'Deck',pergola:'Pergola',shed:'Shed',bwall:'Boundary wall',sgate:'Side gate',meter:'Meter box',secdoor:'Security door'};
const GROUPS=[['p-house','On the house',['walls','gable','fascias','gutters','downpipes','eaves']],['p-win','Windows and doors',['windows','doors','garage','shutters']],['p-ver','The verandah',['verandah','posts','vceiling','handrail']],['p-around','Around the house',['fence','deck','pergola','shed','bwall','sgate','meter','secdoor']]];
const AROUND=['fence','deck','pergola','shed','bwall','sgate','meter','secdoor'];
const SIDES=['front','right','back','left'],SIDEN={front:'Front',right:'Right side',back:'Back',left:'Left side'};
const WINT=[['sash','Double-hung sash'],['casement','Casement'],['colonial','Colonial / bay'],['fixed','Not sure / fixed']];

/* ================= state ================= */
const A={parts:new Set(),extras:{},sides:null,wall:{down:null,up:null}};
const $=id=>document.getElementById(id);
let route=[],i=0;

function shape(){return SHAPES[A.shape||'other'];}
function dims(){const s=shape(),m2=(SIZES.find(x=>x[0]===A.size)||SIZES[1])[3],fp=m2/s.storeys,ratio=s.side/s.front;let f=Math.sqrt(fp/ratio);f=Math.round(f*2)/2;return{front:f,side:Math.round(f*ratio*2)/2,h:s.h,rise:s.rise};}
function sharedSides(){const s=shape();let sh=[...s.shared];if(A.row==='left')sh=sh.filter(x=>x!=='left');if(A.row==='right')sh=sh.filter(x=>x!=='right');if(A.row==='both')sh=[];return sh;}
function sideW(sd){const d=dims();return sd==='front'||sd==='back'?d.front:d.side;}
function defSides(p){const s=shape();if(p==='gable')return s.roof==='gable'||s.roof==='skillion'?['front','back']:['front'];if(['verandah','posts','vceiling','handrail','garage','shutters'].includes(p))return['front'];if(p==='doors')return['front','back'];if(AROUND.includes(p))return['front'];return SIDES;}
function partsOn(sd){const st=A.sides&&A.sides[sd];const base=[...A.parts].filter(p=>!AROUND.includes(p)&&defSides(p).includes(sd));const set=new Set(base.filter(p=>!(st&&st.off.has(p))));if(st)st.add.forEach(p=>set.add(p));return set;}
function initSides(){if(A.sides)return;const sh=sharedSides(),d=dims(),s=shape();A.sides={};SIDES.forEach(sd=>{const w=sideW(sd);A.sides[sd]={paint:!sh.includes(sd),shared:sh.includes(sd),w,h:d.h,off:new Set(),add:new Set(),material:null,confirmed:false,windows:Math.max(1,Math.round(w/(sd==='front'||sd==='back'?4.5:5)))*s.storeys,doors:sd==='front'||sd==='back'?1:0,size:null,cond:null,checked:false};});}
function mat(sd){const st=A.sides&&A.sides[sd];return (st&&st.material)||A.wall.down||shape().wall;}

/* ================= route ================= */
function buildRoute(){
  const r=['what','home','size'];
  if(shape().shared.length)r.push('row');
  GROUPS.forEach(([id])=>r.push(id));
  if(A.parts.has('walls')){r.push('a-walls');if(shape().storeys===2)r.push('a-wallsUp');if(A.wall.down==='brick'||A.wall.up==='brick')r.push('a-brick');}
  if(A.parts.has('gable'))r.push('a-gable');
  if(A.parts.has('windows'))r.push('a-win');
  if(A.parts.has('garage'))r.push('a-garage');
  if(A.parts.has('posts'))r.push('a-posts');
  if([...A.parts].some(p=>['fence','deck','bwall'].includes(p)))r.push('a-extras');
  r.push('colours','access');
  SIDES.forEach(sd=>r.push('s-'+sd));
  r.push('details','gate');
  SIDES.forEach(sd=>r.push('w-'+sd));
  r.push('wdone');
  return r;
}
function go(id){route=buildRoute();i=route.indexOf(id);if(i<0)i=0;render();}
function nextScreen(){route=buildRoute();let n=i+1;while(n<route.length&&skipS(route[n]))n++;i=Math.min(n,route.length-1);render();}
function prevScreen(){route=buildRoute();let n=i-1;while(n>0&&skipS(route[n]))n--;i=Math.max(n,0);render();}
function skipS(id){if(id.startsWith('w-')){const sd=id.slice(2);return !(A.sides&&A.sides[sd].paint);}if(id==='p-ver'&&shape().ver===null&&!A.parts.has('verandah'))return false;return false;}

/* ================= screens ================= */
const H=(h,sub,stage)=>`${stage?`<div class="stage">${stage}</div>`:''}<h1>${h}</h1>${sub?`<p class="sub">${sub}</p>`:''}`;
const optBtn=(k,v,t,d,extra='')=>`<button class="opt ${A[k]===v?'sel':''}" data-k="${k}" data-v="${v}">${extra}<div><div class="t">${t}</div>${d?`<div class="d">${d}</div>`:''}</div></button>`;
const SCREENS={
  what:()=>H('What are we painting?','Your range in a couple of minutes.')+`<div class="opts two">${optBtn('what','Inside','Inside','Rooms, walls, ceilings, trims')}${optBtn('what','Outside','Outside','Walls, roofline, trims, doors')}</div>`,
  home:()=>H('What kind of home is it?','Near enough is fine.','Your home')+`<div class="opts two">${Object.entries(SHAPES).map(([k,s])=>`<button class="opt ${A.shape===k?'sel':''}" data-k="shape" data-v="${k}"><div class="sil">${silhouette(k)}</div><div class="t" style="font-size:14px">${s.name}</div></button>`).join('')}</div>`,
  size:()=>H('About how big is it?','Roughly — the house size, not the block.','Your home')+`<div class="pills">${SIZES.map(([k,n,h])=>`<button class="opt ${A.size===k?'sel':''}" data-k="size" data-v="${k}">${n}<small>${h}</small></button>`).join('')}</div>`,

function priceSide(sd){const st=A.sides[sd];if(!st.paint)return{total:0,lines:[]};const on=partsOn(sd),w=st.w,h=st.h,r=shape().rise,m=mat(sd);const RATE={boards:38,render:32,brick:A.brickPainted==='no'?48:36,stucco:40,sheet:30,colorbond:34,vt:28,concrete:30};let t=0,L=[];
  const add=(n,v)=>{t+=v;L.push(n);};
  if(on.has('walls'))add(MATS[m],w*h*RATE[m]);if(on.has('gable')&&r)add('gable',0.5*w*r*40);
  if(on.has('fascias'))add('fascias',w*14);if(on.has('gutters'))add('gutters',w*10);if(on.has('downpipes'))add('downpipes',(w>10?2:1)*60);if(on.has('eaves'))add('eaves',w*12);
  if(on.has('windows'))add(st.windows+' windows',st.windows*(A.winType==='sash'?260:180));if(on.has('doors')&&st.doors)add(st.doors+' doors',st.doors*220);
  if(on.has('garage'))add('garage door',A.garage==='2'?650:350);if(on.has('shutters'))add('shutters',st.windows*2*90);
  if(on.has('posts'))add('posts',Math.max(2,Math.round(w*0.8/2.6)+1)*70);if(on.has('vceiling'))add('verandah ceiling',w*0.8*2.4*35);if(on.has('handrail'))add('handrail',w*0.8*28);
  const cm={weathered:1.2,peeling:1.35}[st.cond]||1;return{total:t*cm,lines:L};}
function priceAll(){initSides();let t=0;const rows=[];SIDES.forEach(sd=>{const p=priceSide(sd);if(A.sides[sd].paint){rows.push([SIDEN[sd],p]);t+=p.total;}});
  let ex=0;const E={fence:()=>(A.extras.fence||20)*22,deck:()=>(A.extras.deck||20)*45,pergola:()=>450,shed:()=>640,bwall:()=>(A.extras.bwall||10)*1.8*36,sgate:()=>120,meter:()=>35,secdoor:()=>90};[...A.parts].filter(p=>AROUND.includes(p)).forEach(p=>ex+=E[p]());
  t+=ex;if(shape().storeys===2)t*=1.15;if(A.access&&(A.access.has('steep')||A.access.has('high')))t+=350;if(A.colours!=='Same colours')t*=1.08;t*=1.1;return{t,rows,ex};}
const f=n=>'$'+(Math.round(n/10)*10).toLocaleString('en-AU');

  else if(s.roof==='parapet')r=`<rect x="10" y="${top-8}" width="80" height="6" fill="#5b6672"/><polygon points="40,${top-8} 50,${top-16} 60,${top-8}" fill="#5b6672"/>`;
  else r=`<polygon points="10,${top} 90,${top-12} 90,${top-8} 10,${top+4}" fill="#5b6672"/>`;
  const walls=`<rect x="14" y="${top}" width="72" height="${54-top}" fill="#dfe8e3" stroke="#aab4bd"/>`;

  return `<svg viewBox="0 0 100 56">${extra}${walls}${vt}${r}${ver}<rect x="44" y="40" width="8" height="14" fill="#8a94a0"/><rect x="22" y="${top+8}" width="10" height="8" fill="#fff" stroke="#8a94a0"/><rect x="68" y="${top+8}" width="10" height="8" fill="#fff" stroke="#8a94a0"/></svg>`;}

function pattern(p,m){const id=`pat-${p}`;let body='';
  if(m==='boards')body=`<pattern id="${id}" width="8" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="3.5" x2="8" y2="3.5" stroke="rgba(0,0,0,.13)" stroke-width="1"/></pattern>`;
  else if(m==='brick')body=`<pattern id="${id}" width="8" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="3.5" x2="8" y2="3.5" stroke="rgba(0,0,0,.12)"/><line x1="4" y1="0" x2="4" y2="4" stroke="rgba(0,0,0,.08)"/></pattern>`;
  else if(m==='stucco')body=`<pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="rgba(0,0,0,.12)"/></pattern>`;
  else if(m==='sheet')body=`<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse"><line x1="13.5" y1="0" x2="13.5" y2="14" stroke="rgba(0,0,0,.14)"/><line x1="0" y1="13.5" x2="14" y2="13.5" stroke="rgba(0,0,0,.08)"/></pattern>`;
  else if(m==='colorbond')body=`<pattern id="${id}" width="3" height="3" patternUnits="userSpaceOnUse"><line x1="2.5" y1="0" x2="2.5" y2="3" stroke="rgba(0,0,0,.12)"/></pattern>`;
  else if(m==='vt')body=`<pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse"><line x1="4.5" y1="0" x2="4.5" y2="5" stroke="rgba(0,0,0,.18)"/></pattern>`;
  return body?`<defs>${body}</defs>`:'';}
function elevation(p,sd){
  const s=shape(),d=dims(),st=A.sides&&A.sides[sd];const w=st?st.w:sideW(sd),h=st?st.h:d.h,rise=s.rise;const clampW=v=>Math.max(0,v);const on=A.sides?partsOn(sd):new Set([...A.parts].filter(x=>!AROUND.includes(x)&&defSides(x).includes(sd)));
  const painting=st?st.paint:!sharedSides().includes(sd);const has=k=>painting&&on.has(k);
  const sc=Math.min(150/w,84/(h+Math.max(rise,1.6)+0.6));const x0=100-w*sc/2,x1=x0+w*sc,G=108,top=G-h*sc;const gableSide=(sd==='front'||sd==='back');
  const m=mat(sd);let out=`<svg class="pic" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">${pattern(p,m)}<rect width="200" height="120" fill="#eef2f5"/><rect y="${G}" width="200" height="12" fill="#cfdccf"/>`;
  // neighbours (front view)
  if(sd==='front'){sharedSides().forEach(x=>{out+=`<rect x="${x==='left'?x0-22:x1+4}" y="${top+8}" width="18" height="${G-top-8}" fill="none" stroke="#b7c0c8" stroke-dasharray="3 2"/>`;});}
  // walls
  let wallShape;const rr=s.roof==='hip'?Math.min(1.6,w*0.16)*sc:rise*sc;
  if(s.roof==='skillion'&&gableSide){const hi=sd==='front'?x0:x1,lo=sd==='front'?x1:x0;wallShape=`<polygon points="${x0},${G} ${x0},${hi===x0?top-rr:top} ${x1},${hi===x1?top-rr:top} ${x1},${G}"/>`;}
  else if(s.roof==='parapet'){wallShape=`<rect x="${x0}" y="${top-rr}" width="${x1-x0}" height="${G-top+rr}"/>`;}
  else wallShape=`<rect x="${x0}" y="${top}" width="${x1-x0}" height="${G-top}"/>`;
  out+=surf(p,'walls',wallShape,false,has('walls'));
  if(m!=='render'&&m!=='concrete')out+=`<g fill="url(#pat-${p})">${wallShape}</g>`;
  if(s.storeys===2)out+=`<line x1="${x0}" y1="${(top+G)/2}" x2="${x1}" y2="${(top+G)/2}" stroke="#c4cad0"/>`;
  // roof + gable
  let fasc='',gut='',eav='';
  if(s.roof==='gable'&&gableSide){const ap=`${(x0+x1)/2},${top-rr}`;out+=surf(p,'gable',`<polygon points="${x0},${top} ${ap} ${x1},${top}"/>`,false,has('gable'));
    if(A.gableFill==='strap')out+=`<g stroke="#8a94a0" stroke-width="1.2"><line x1="${(x0+x1)/2}" y1="${top-rr}" x2="${(x0+x1)/2}" y2="${top}"/><line x1="${x0+(x1-x0)*.25}" y1="${top-rr/2}" x2="${x0+(x1-x0)*.25}" y2="${top}"/><line x1="${x0+(x1-x0)*.75}" y1="${top-rr/2}" x2="${x0+(x1-x0)*.75}" y2="${top}"/></g>`;
    fasc=rake(x0-6,top+1,(x0+x1)/2,top-rr-3,3)+rake((x0+x1)/2,top-rr-3,x1+6,top+1,3);}
  else if(s.roof==='parapet'){out+=`<rect x="${x0-3}" y="${top-rr}" width="${x1-x0+6}" height="3" fill="#5b6672"/>`;if(gableSide){out+=`<polygon points="${(x0+x1)/2-8},${top-rr} ${(x0+x1)/2},${top-rr-7} ${(x0+x1)/2+8},${top-rr}" fill="#5b6672"/><rect x="${x1-8}" y="${top-rr-9}" width="3" height="9" fill="#5b6672"/>`;}fasc=`<rect x="${x0-3}" y="${top-rr+3}" width="${x1-x0+6}" height="3"/>`;}
  else if(s.roof==='skillion'){const hi=sd==='front'?x0:x1;if(gableSide)out+=`<polygon points="${x0-6},${hi===x0?top-rr-4:top-4} ${x1+6},${hi===x1?top-rr-4:top-4} ${x1+6},${hi===x1?top-rr:top} ${x0-6},${hi===x0?top-rr:top}" fill="#5b6672"/>`;else out+=`<rect x="${x0-6}" y="${top-rr-4}" width="${x1-x0+12}" height="${rr+4}" fill="#5b6672"/>`;
    fasc=`<rect x="${x0-6}" y="${gableSide?top-1:top-1}" width="${x1-x0+12}" height="3"/>`;gut=`<rect x="${x0-6}" y="${top+2}" width="${x1-x0+12}" height="2.5"/>`;eav=`<rect x="${x0-6}" y="${top+4.5}" width="${x1-x0+12}" height="2"/>`;}
  else {out+=`<polygon points="${x0-6},${top} ${x0+(x1-x0)*.22},${top-rr} ${x1-(x1-x0)*.22},${top-rr} ${x1+6},${top}" fill="#5b6672"/>`;fasc=`<rect x="${x0-6}" y="${top-4}" width="${x1-x0+12}" height="3"/>`;gut=`<rect x="${x0-6}" y="${top-1}" width="${x1-x0+12}" height="2.5"/>`;eav=`<rect x="${x0-5}" y="${top+1.5}" width="${x1-x0+10}" height="2"/>`;}
  if(s.roof==='gable'&&!gableSide){out+=`<polygon points="${x0-6},${top} ${x0+(x1-x0)*.1},${top-rr} ${x1-(x1-x0)*.1},${top-rr} ${x1+6},${top}" fill="#5b6672"/>`;fasc=`<rect x="${x0-6}" y="${top-4}" width="${x1-x0+12}" height="3"/>`;gut=`<rect x="${x0-6}" y="${top-1}" width="${x1-x0+12}" height="2.5"/>`;eav=`<rect x="${x0-5}" y="${top+1.5}" width="${x1-x0+10}" height="2"/>`;}
  // cross gable added on a non-gable side
  if(on.has('gable')&&!(s.roof==='gable'&&gableSide)&&s.roof!=='parapet'){const gw=(x1-x0)*0.45,cx=(x0+x1)/2,gh=1.9*sc;out+=surf(p,'gable',`<polygon points="${cx-gw/2},${top} ${cx},${top-gh} ${cx+gw/2},${top}"/>`,false,has('gable'));}
  out+=surf(p,'fascias',fasc,true,has('fascias'));if(gut)out+=surf(p,'gutters',gut,true,has('gutters'));if(eav)out+=surf(p,'eaves',eav,true,has('eaves'));
  const dp=w>10?[x0+1.5,x1-4]:[x1-4];out+=surf(p,'downpipes',dp.map(x=>`<rect x="${x}" y="${top}" width="2.5" height="${G-top}"/>`).join(''),true,has('downpipes'));
  // openings
  const nW=st?st.windows:Math.max(1,Math.round(w/4.5))*s.storeys,rows=s.storeys,perRow=Math.max(1,Math.ceil(nW/rows));const ww=0.9*sc,wh=1.2*sc;let win='',glass='';
  for(let r=0;r<rows;r++){const base=rows===2?(r===0?top+(G-top)/2:top):top;const floorH=rows===2?(G-top)/2:G-top;const sill=base+floorH-(0.9*sc)-wh;const cnt=r===rows-1?nW-perRow*(rows-1):perRow;
    for(let k=0;k<cnt;k++){const x=x0+(x1-x0)*(k+1)/(cnt+1)-ww/2;win+=`<rect x="${x}" y="${sill}" width="${ww}" height="${wh}"/>`;glass+=`<rect x="${x+1}" y="${sill+1}" width="${ww-2}" height="${wh-2}" fill="#dbeaf0"/>`+(A.winType==='sash'?`<line x1="${x+1}" y1="${sill+wh/2}" x2="${x+ww-1}" y2="${sill+wh/2}" stroke="#aab4bd"/>`:A.winType==='casement'?`<line x1="${x+ww/2}" y1="${sill+1}" x2="${x+ww/2}" y2="${sill+wh-1}" stroke="#aab4bd"/>`:A.winType==='colonial'?`<line x1="${x+ww/2}" y1="${sill+1}" x2="${x+ww/2}" y2="${sill+wh-1}" stroke="#aab4bd"/><line x1="${x+1}" y1="${sill+wh/2}" x2="${x+ww-1}" y2="${sill+wh/2}" stroke="#aab4bd"/>`:'');
      if(on.has('shutters'))win+=``;}}
  out+=glass+surf(p,'windows',win,true,has('windows'));
  if(on.has('shutters')&&sd==='front'){let sh='';const sill=G-(0.9*sc)-wh;for(let k=0;k<perRow;k++){const x=x0+(x1-x0)*(k+1)/(perRow+1)-ww/2;sh+=`<rect x="${x-4}" y="${sill}" width="3" height="${wh}"/><rect x="${x+ww+1}" y="${sill}" width="3" height="${wh}"/>`;}out+=surf(p,'shutters',sh,true,has('shutters'));}
  const nD=st?st.doors:(sd==='front'||sd==='back'?1:0);let dr='';for(let k=0;k<nD;k++){const x=sd==='front'?x0+(x1-x0)*0.3-0.45*sc:x0+(x1-x0)*(k+1)/(nD+1)-0.45*sc;dr+=`<rect x="${x}" y="${G-2.1*sc}" width="${0.9*sc}" height="${2.1*sc}"/>`;}
  out+=surf(p,'doors',dr,true,has('doors'));
  if(sd==='front'&&on.has('garage')){const gw=(A.garage==='2'?5:2.5)*sc;out+=surf(p,'garage',`<rect x="${x1-gw-2}" y="${G-2.2*sc}" width="${gw}" height="${2.2*sc}"/>`,true,has('garage'));}
  // verandah
  if(on.has('verandah')&&sd==='front'){const vx0=x0+(x1-x0)*0.1,vx1=x1-(x1-x0)*0.1,vy=Math.min(top+6,G-2.4*sc);out+=`<rect x="${vx0}" y="${vy-3}" width="${vx1-vx0}" height="3" fill="#5b6672"/>`;
    if(on.has('vceiling'))out+=surf(p,'vceiling',`<rect x="${vx0}" y="${vy}" width="${clampW(vx1-vx0)}" height="2.5"/>`,true,has('vceiling'));
    if(on.has('posts')){const n=Math.max(2,Math.round(w*0.8/2.6)+1);let ps='';for(let k=0;k<n;k++){const x=vx0+(vx1-vx0)*k/(n-1);const pw=A.postKind==='columns'?4:A.postKind==='iron'?1.5:2.5;ps+=`<rect x="${x-pw/2}" y="${vy}" width="${pw}" height="${G-vy}"/>`;}
      if(A.postKind==='iron')ps+=`<rect x="${vx0}" y="${vy+2.5}" width="${vx1-vx0}" height="2" />`;out+=surf(p,'posts',ps,true,has('posts'));}
    if(on.has('handrail'))out+=surf(p,'handrail',`<rect x="${vx0}" y="${G-1*sc}" width="${vx1-vx0}" height="1.5"/>`,true,has('handrail'));}
  // around the house (front only)
  if(sd==='front'){const ar=[...A.parts].filter(x=>AROUND.includes(x));let k=0;
    if(ar.includes('fence')){let fz='';for(let x=4;x<x0-26;x+=4)fz+=`<rect x="${x}" y="${G-10}" width="2" height="10"/>`;for(let x=x1+26;x<196;x+=4)fz+=`<rect x="${x}" y="${G-10}" width="2" height="10"/>`;out+=surf(p,'fence',fz,true,has('fence'));}
    if(ar.includes('deck'))out+=surf(p,'deck',`<rect x="${x0+6}" y="${G-2}" width="${clampW((x1-x0)*0.5)}" height="3"/>`,true,has('deck'));
    if(ar.includes('shed'))out+=surf(p,'shed',`<rect x="${x1+10}" y="${G-14}" width="16" height="14"/>`,true,has('shed'));
    if(ar.includes('pergola'))out+=surf(p,'pergola',`<rect x="${x1+8}" y="${G-22}" width="20" height="2"/><rect x="${x1+9}" y="${G-20}" width="2" height="20"/><rect x="${x1+25}" y="${G-20}" width="2" height="20"/>`,true,has('pergola'));
    if(ar.includes('bwall'))out+=surf(p,'bwall',`<rect x="2" y="${G-9}" width="${Math.max(0,x0-28)}" height="9"/>`,true,has('bwall'));
    if(ar.includes('meter'))out+=surf(p,'meter',`<rect x="${x0+3}" y="${G-1.6*sc}" width="5" height="6"/>`,true,has('meter'));
    if(ar.includes('sgate'))out+=surf(p,'sgate',`<rect x="${x1+2}" y="${G-1.6*sc}" width="7" height="${1.6*sc}"/>`,true,has('sgate'));}
  if(!painting)out+=`<rect width="200" height="108" fill="rgba(238,242,245,.55)"/><text x="100" y="60" text-anchor="middle" font-size="11" fill="#8a94a0" font-family="system-ui">Not painting this side</text>`;
  return out+'</svg>';}
function rake(ax,ay,bx,by,t){const dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy),nx=-dy/l*t/2,ny=dx/l*t/2;return `<polygon points="${ax+nx},${ay+ny} ${bx+nx},${by+ny} ${bx-nx},${by-ny} ${ax-nx},${ay-ny}"/>`;}

let curSide='front';
function sideFor(id){if(id&&(id.startsWith('s-')||id.startsWith('w-')))return id.slice(2);return 'front';}
function updatePics(){const id=route[i];curSide=sideFor(id);
  if(!A.shape){$('thumb').innerHTML='';$('bigpic').innerHTML='';stripText();return;}
  $('thumb').innerHTML=elevation('t',curSide);$('bigpic').innerHTML=elevation('b',curSide);
  $('compass').innerHTML=SIDES.map(s=>`<span class="${s===curSide?'now':''}" data-cs="${s}">${SIDEN[s].replace(' side','')}</span>`).join('');
  $('compass').querySelectorAll('span').forEach(s=>s.onclick=()=>{curSide=s.dataset.cs;$('bigpic').innerHTML=elevation('b',curSide);$('compass').querySelectorAll('span').forEach(x=>x.classList.toggle('now',x===s));});
  const showChips=id&&id.startsWith('p-');$('bigchips').innerHTML=showChips?GROUPS.flatMap(g=>g[2]).filter(k=>!AROUND.includes(k)).map(k=>`<button class="chip ${A.parts.has(k)?'sel':''}" data-bp="${k}">${PARTS[k]}</button>`).join(''):'';
  $('bigchips').querySelectorAll('[data-bp]').forEach(c=>c.onclick=()=>{const p=c.dataset.bp;const on=!A.parts.has(p);on?A.parts.add(p):A.parts.delete(p);c.classList.toggle('sel',on);document.querySelectorAll(`.chip[data-p="${p}"]`).forEach(x=>x.classList.toggle('sel',on));paint(p,on,true);A.sides=null;stripText();});
  $('bigcap').textContent=showChips?'Tap a part to paint it in or out.':id&&id.startsWith('s-')?'Turn the house with the buttons above.':'Updates as you answer.';
  stripText();}
function stripText(){const parts=[A.what,A.shape&&shape().name,A.size&&(SIZES.find(x=>x[0]===A.size)||[])[1],A.parts.size?A.parts.size+' parts':null,A.wall.down&&MATS[A.wall.down],A.colours].filter(Boolean);
  $('strip-b').textContent=parts.length?parts.join(' · '):'Your place';
  const id=route[i];let s='Updates as you answer · tap to see';
  if(id&&(id.startsWith('s-')||id.startsWith('w-')))s=SIDEN[curSide]+' · '+SIDES.filter(x=>A.sides[x].paint&&A.sides[x][id.startsWith('s-')?'confirmed':'checked']).length+' of '+SIDES.filter(x=>A.sides[x].paint).length+' done';
  else if(A.parts.size)s=A.parts.size+' parts ticked · tap to see';
  $('strip-s').textContent=s;}
const anims=new WeakMap();
function paint(k,on,animate){document.querySelectorAll(`[data-surf="${k}"]`).forEach(g=>{const r=g.querySelector('.cprect'),roller=g.querySelector('.roller');if(!r)return;const from=+r.getAttribute('width'),to=on?200:0;if(!animate){r.setAttribute('width',to);return;}
  let y=60;try{const b=g.querySelector('.base,.trimbase').getBBox();y=b.y+b.height/2;}catch(e){}const t0=performance.now(),dur=520;roller.classList.add('on');if(anims.has(g))cancelAnimationFrame(anims.get(g));
  const step=now=>{const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3),w=from+(to-from)*e;r.setAttribute('width',w);roller.setAttribute('transform',`translate(${w},${y})`);if(t<1)anims.set(g,requestAnimationFrame(step));else roller.classList.remove('on');};anims.set(g,requestAnimationFrame(step));});}

/* ================= sheets / contact ================= */
function openSheet(w){if(w==='pic'&&!A.shape)return;$('sbg').classList.add('open');$('sheet-'+w).classList.add('open');if(w==='pic')updatePics();}
function closeSheets(){document.querySelectorAll('.sheet,.sheet-bg').forEach(x=>x.classList.remove('open'));}
function openContact(){['c-menu','c-form','c-slots','c-done'].forEach(x=>$(x).style.display=x==='c-menu'?'':'none');openSheet('contact');}
function bookStart(){if(A.name&&A.name!=='there'&&A.mobile){bookSlots();return;}$('c-menu').style.display='none';$('c-form').style.display='';cval();}
['c-name','c-mobile'].forEach(id=>$(id).addEventListener('input',cval));
function cval(){$('c-next').disabled=!($('c-name').value.trim()&&$('c-mobile').value.replace(/\s/g,'').length>=10);}
function bookSlots(){if($('c-name').value.trim()){A.name=$('c-name').value.trim();A.mobile=$('c-mobile').value.trim();}$('c-form').style.display='none';$('c-menu').style.display='none';$('c-slots').style.display='';
  $('slot-list').innerHTML=[['Thu 30 Oct','9:00 am'],['Thu 30 Oct','1:30 pm'],['Tue 4 Nov','10:30 am'],['Tue 4 Nov','3:00 pm']].map(([d,t])=>`<button class="opt" onclick="bookDone('${d}, ${t}')"><div><div class="t">${d}</div><div class="d">${t}</div></div></button>`).join('');}
function bookDone(s){A.visit=s;$('c-slots').style.display='none';$('c-done').style.display='';$('c-done-sub').textContent=`Sarah, ${s}, at 15 Westgarth St. We've texted the details to ${A.mobile||'your mobile'}. Your answers so far are saved.`;}

/* boot: start on Outside */
A.what='Outside';route=buildRoute();i=1;render();
</script>
