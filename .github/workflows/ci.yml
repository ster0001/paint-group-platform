# CI — the gate the August 2026 audit found missing entirely (A1-05).
#
# Two jobs:
#   gate  typecheck + lint + unit tests. No secrets, runs everywhere, fast.
#   e2e   the real browser against the TEST Supabase project. Needs secrets.
#
# `gate` is the one to mark "required" in branch protection today. Add `e2e`
# as required once its secrets are in (see the job's guard step).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # C7 · a branch with no PR open can still be exercised against the test
  # project deliberately — Actions → CI → Run workflow. The point of the gate
  # below is to stop e2e running on EVERY push automatically, not to make it
  # unavailable.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      # Full history: the help index compares each help file's
      # verified_at_commit against later commits to its source paths.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Next GENERATES the route/layout types (LayoutProps, PageProps) into
      # .next/types. A clean checkout has none, so tsc fails with "Cannot find
      # name 'LayoutProps'" — which is exactly how CI run #1 failed while the
      # same command passed locally, on a working tree that still had .next
      # from an earlier build. typegen does it without a full build.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      # CLAUDE.md: "lint and typecheck must pass before any commit". Errors are
      # zero and must stay zero. The warning cap is a RATCHET, not a target —
      # 23 when CI landed (F1), 11 after the 30 Aug clear-out, 5 after that,
      # 4 on 10 Sep. Lower it when you clear some; never raise it. Raising it
      # is how 11 becomes 200.
      - name: Lint (0 errors, warnings ratcheted at 4)
        run: npx eslint --max-warnings 4

      - name: Unit tests
        run: npm test

      # Help files are part of definition of done (CLAUDE.md). This validates
      # every docs/help/<feature>/<role>.md front-matter, refuses a role outside
      # staff|pc|contractor|customer, and fails if the committed _index.json
      # (what the assistant will retrieve from) is behind the files. It also
      # prints a ::warning:: for any help file whose source paths changed after
      # its verified_at_commit — stale walkthroughs surface, they never fail.
      - name: Help content index (front-matter + role check)
        run: npm run help:index -- --check

      # The money paths are meant to be mutation-tested (audit P6). This is the
      # cheap standing version: break a pricing constant, prove the suite
      # notices. If this step ever PASSES, the pricing suite has stopped
      # testing pricing.
      - name: Mutation canary — pricing must be defended
        run: |
          cp lib/pricing/engine.ts /tmp/engine.bak
          sed -i 's/1 + 0\.75 \* (coats - 1)/1 + 0.70 * (coats - 1)/' lib/pricing/engine.ts
          if npx vitest run lib/pricing >/dev/null 2>&1; then
            cp /tmp/engine.bak lib/pricing/engine.ts
            echo "::error::Mutating the marginal-coat rule did not fail any test."
            echo "The pricing suite is not testing what it claims. See docs/audits/audit-2026-08-full.md (P6)."
            exit 1
          fi
          cp /tmp/engine.bak lib/pricing/engine.ts
          echo "Pricing mutation was caught — suite is live."

  e2e:
    name: e2e (test project)
    runs-on: ubuntu-latest
    needs: gate
    # WHY e2e DOES NOT RUN ON EVERY PUSH (11 Sep 2026).
    #
    # `pull_request` already re-runs on every push to a branch that has a PR
    # open (the `synchronize` event), so `push: branches: ["**"]` was giving
    # the SAME COMMIT two e2e runs. Checked against the run list: #360/#361 are
    # both bc32a13, #364/#365 are both 05ae971. Half of every e2e run against
    # the one test project was a duplicate of the other half.
    #
    # So e2e runs on pull_request, on main, and on demand. The only coverage
    # lost is a branch with NO pull request open — which is a branch nobody is
    # asking to merge yet, and `workflow_dispatch` covers it when you do want
    # it. `gate` (typecheck · lint · unit) is untouched and still runs on every
    # push: it needs no secrets and no database, so it costs the test project
    # nothing.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # ONE e2e RUN AT A TIME, ACROSS THE WHOLE REPOSITORY (11 Sep 2026).
    #
    # The workflow-level group above is keyed on `github.ref`, so it only ever
    # serialises runs on the SAME branch. Every branch got its own slot — and
    # on 11 Sep seven ran at once against the single `t4g.nano` test project.
    # Compute hit 98%, the gateway started cycling, `/auth/v1/signup` and even
    # `/auth/v1/admin/users` timed out, and the project reported Unhealthy.
    # Nothing was wrong with the data: the database is 623 MB on a 47%-used
    # disk. It was seven browsers' worth of load on the smallest instance
    # Supabase sells.
    #
    # This group is a CONSTANT, so it spans branches and pull requests: one
    # e2e job runs, the rest queue. `cancel-in-progress: false` on purpose —
    # cancelling would silently drop coverage for the branch that lost the
    # race, which is how main went red for three merges without anyone
    # noticing.
    concurrency:
      group: e2e-test-project
      cancel-in-progress: false
    env:
      # WHAT IS PRODUCTION — supplied, never inferred and never defaulted.
      # A project ref is not a secret (it is in every public URL the app
      # serves); the guards in e2e/global-setup.ts, scripts/seed-target.mjs and
      # scripts/c1/env.mjs REFUSE TO RUN without it. Supplying it here is not a
      # fallback: it is the one place the value is stated.
      PRODUCTION_SUPABASE_REF: llmrvgdequpmzzuaxdhq
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Fail with instructions rather than skipping. A skipped e2e job that
      # reports green is exactly the failure mode A1-06 describes: 160
      # conditional skips meant a passing run could assert almost nothing.
      # The store may use the .env.test.local names for the three Supabase
      # values (that is how they were added on 4 Sep) — both spellings are read.
      # Names each missing one (4 Sep): "not configured" alone sent Tom hunting
      # through nine secrets that were all present — in the wrong place. They
      # must be REPOSITORY secrets (Settings → Secrets and variables → Actions →
      # "Repository secrets"), not Environment secrets: this job names no
      # `environment:`, so environment secrets are invisible to it.
      - name: Check the e2e secrets are configured
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_CONTRACTOR_EMAIL: ${{ secrets.E2E_CONTRACTOR_EMAIL }}
          E2E_CONTRACTOR_PASSWORD: ${{ secrets.E2E_CONTRACTOR_PASSWORD }}
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
        run: |
          missing=""
          for n in E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_SERVICE_ROLE_KEY E2E_STAFF_EMAIL E2E_STAFF_PASSWORD E2E_CONTRACTOR_EMAIL E2E_CONTRACTOR_PASSWORD E2E_CUSTOMER_EMAIL E2E_CUSTOMER_PASSWORD; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These e2e secrets are EMPTY in this workflow:$missing"
            echo "They must be REPOSITORY secrets: GitHub → Settings → Secrets and variables → Actions → tab 'Repository secrets'."
            echo "Environment secrets and Codespaces/Dependabot secrets are not visible to this job. Names are case-sensitive, no spaces."
            echo "Values come from .env.test.local (TEST project only, never production)."
            exit 1
          fi
          echo "All nine e2e secrets present."
          # The tripwire in scripts/c1/env.mjs reads .env.local, which a CI
          # runner does not have — so the refusal lives here too. The
          # production project ref is public (it is in every customer URL);
          # naming it is not a leak, running e2e against it would be a disaster.
          case "$E2E_SUPABASE_URL" in
            *llmrvgdequpmzzuaxdhq*)
              echo "::error::The Supabase URL secret points at the PRODUCTION project. e2e must run against the TEST project (qarfyjrzgdeoqbnbbxfp) — fix the secret."
              exit 1;;
          esac
          echo "Supabase URL secret is not production."
          # THE KEYS MUST BELONG TO THE PROJECT THE URL NAMES (12 Sep 2026).
          # Run #371 had all nine secrets present and the URL secret naming the
          # test project — and the service-role key belonged to another project.
          # Every service call answered "Invalid API key", /estimate fell back
          # to the holding page, and 83 specs timed out identically 30 minutes
          # later. A legacy key is a JWT whose payload carries `ref` and `role`;
          # comparing that to the URL catches a wrong paste in one second and
          # prints only the refs (public — they are in every customer URL).
          node - <<'JS'
            const url = process.env.E2E_SUPABASE_URL;
            const want = url.match(/^https?:\/\/([a-z0-9]{20})\.supabase\.(co|in)\b/)?.[1];
            if (!want) { console.error(`::error::E2E_SUPABASE_URL has no readable project ref (${url})`); process.exit(1); }
            const claims = (k) => { try { return JSON.parse(Buffer.from(k.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"), "base64").toString("utf8")); } catch { return null; } };
            let bad = false;
            for (const [name, role] of [["E2E_SUPABASE_ANON_KEY", "anon"], ["E2E_SERVICE_ROLE_KEY", "service_role"]]) {
              const c = claims(process.env[name] ?? "");
              if (!c) { console.log(`${name}: not a legacy JWT key — cannot verify its project; the run will find out.`); continue; }
              if (c.ref !== want) { console.error(`::error::${name} belongs to project ${c.ref}, but E2E_SUPABASE_URL names ${want}. Re-paste it from the ${want} project (Settings → API). It is a repository secret.`); bad = true; }
              else if (c.role !== role) { console.error(`::error::${name} carries role "${c.role}", expected "${role}" — the anon and service keys are swapped.`); bad = true; }
              else console.log(`${name}: belongs to ${want}, role ${role}.`);
            }
            if (bad) process.exit(1);
          JS

      - run: npx playwright install --with-deps chromium

      - name: Build (test stack env baked in, as a deploy would)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3101
        run: npm run build

      - name: Customer journey · role RLS · ledger parity
        env:
          CI: "1"
          # The assistant journeys drive the deterministic stub model — no
          # Anthropic key in CI, ever. Same switch .env.test.local sets.
          AGENT_MODEL_STUB: "1"
          # Throwaway, runner-only: the abandon-sweep journey calls the cron
          # route, which needs SOME shared secret. Never a real one here.
          CRON_SECRET: e2e-runner-cron-secret
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_CONTRACTOR_EMAIL: ${{ secrets.E2E_CONTRACTOR_EMAIL }}
          E2E_CONTRACTOR_PASSWORD: ${{ secrets.E2E_CONTRACTOR_PASSWORD }}
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
          E2E_BASE_URL: http://localhost:3101
          NEXT_PUBLIC_SITE_URL: http://localhost:3101
        # CI=1 makes e2e/global-setup.ts turn a missing credential into a failed
        # run instead of a silent skip, and it still refuses production.
        run: |
          npx next start -p 3101 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3101/login && break; sleep 1; done
          npx playwright test e2e/customer-journey e2e/wo-rls.spec.ts e2e/account-rls.spec.ts e2e/ledger-parity.spec.ts e2e/trade-org-rls.spec.ts

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
